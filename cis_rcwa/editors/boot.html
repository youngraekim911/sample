<!doctype html>
<meta charset="utf-8">
<title>CIS Simulator — 준비 중</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0e1318;--panel:#161d24;--line:#26313b;--ink:#dbe6ee;--dim:#8ea1af;--faint:#5b6d7a;
    --mint:#35d1c4;--amber:#f2c14e;--red:#e2624a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme: light){:root{--bg:#eef2f4;--panel:#fff;--line:#dbe3e8;--ink:#16222b;--dim:#54646f;--faint:#8a9aa5;--mint:#118a80;--amber:#c9902a;--red:#c2492f}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font:14px/1.6 var(--ui)}
  .box{text-align:center;padding:32px 20px}
  h1{font-size:17px;font-weight:700;letter-spacing:.4px;margin:22px 0 4px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 22px}
  /* ── RGGB 2×2 로딩: 위치 고정, 시계방향(좌상R→우상G→우하B→좌하G)으로
        부드럽게 깜빡이며 도는 느낌 ── */
  .bayer{display:grid;grid-template-columns:58px 58px;grid-gap:10px;gap:10px;
    width:126px;margin:0 auto}
  .sq{width:58px;height:58px;border-radius:12px;opacity:.22;transform:scale(.9);
    animation:pulse 1.5s cubic-bezier(.4,0,.2,1) infinite}
  .sq.r {background:#e2624a;animation-delay:0s}      /* 좌상 R  */
  .sq.g1{background:#4fbf6a;animation-delay:.375s}   /* 우상 G  */
  .sq.g2{background:#4fbf6a;animation-delay:1.125s}  /* 좌하 G (시계방향 마지막) */
  .sq.b {background:#4a8fe2;animation-delay:.75s}    /* 우하 B  */
  @keyframes pulse{
    0%,100%{opacity:.22;transform:scale(.9)}
    18%{opacity:1;transform:scale(1.02)}
    36%{opacity:.55;transform:scale(.96)}}
  .steps{margin:0 auto;max-width:380px;text-align:left;font:12px/1.9 var(--mono);color:var(--faint)}
  .steps .ok{color:var(--dim)} .steps .ok b{color:var(--mint);font-weight:400}
  .steps .run b{color:var(--amber);font-weight:400}
  .steps .bad{color:var(--red)}
  .note{margin-top:14px;font-size:12px;color:var(--dim);min-height:18px}
  .err{margin-top:12px;max-width:420px;font-size:12px;color:var(--red);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;white-space:pre-wrap}
</style>
<div class="box">
  <div class="bayer">
    <div class="sq r"></div><div class="sq g1"></div>
    <div class="sq g2"></div><div class="sq b"></div>
  </div>
  <h1>CIS Simulator</h1>
  <p class="sub">환경을 준비하고 있습니다…</p>
  <div class="steps" id="steps">· 서버 응답 대기중…</div>
  <div class="note" id="note"></div>
  <div class="err" id="err" style="display:none"></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ICON={ok:"✓",run:"…",wait:"·",bad:"✗"};
function render(s){
  const rows=(s.steps||[]).map(t=>{
    const cls=t.state==="ok"?"ok":t.state==="bad"?"bad":"run";
    const ic=ICON[t.state]||ICON.wait;
    return `<div class="${cls}">${ic} ${t.name}${t.note?` <b>— ${t.note}</b>`:""}</div>`;
  }).join("");
  $("steps").innerHTML=rows||"· 확인중…";
  if(s.error){ $("err").style.display=""; $("err").textContent=s.error;
    $("note").textContent="문제를 해결한 뒤 창을 닫고 다시 실행해 주세요."; }
}
let readyShown=false;
async function tryMain(){                       // 본 서버가 올라왔으면 시작 화면으로
  try{ const r=await fetch("/api/ping",{cache:"no-store"});
    if(r.ok){ location.href="/"; return true; } }catch(_){}
  return false;
}
async function tick(){
  try{
    const r=await fetch("/api/boot/status",{cache:"no-store"});
    if(r.status===404){ location.reload(); return; }
    const s=await r.json();
    if(s.ready && !s.steps){ location.reload(); return; }   // 이미 본 서버
    render(s);
    if(s.ready && !s.error && !readyShown){ readyShown=true;
      $("note").textContent="준비 완료 — 시작 화면으로 이동합니다…"; }
    if(readyShown) await tryMain();
  }catch(_){ await tryMain(); }                 // 부트→본 서버 교체 순간
  setTimeout(tick, 400);
}
tick();
</script>
