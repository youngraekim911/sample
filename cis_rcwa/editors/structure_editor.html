  }

<script>
"use strict";
// ============================ 미니 YAML (subset) ============================
const YAML = {
  emit(obj){ return this._block(obj, 0); },
  _block(o, ind){
    const pad = "  ".repeat(ind); let s = "";
    if(Array.isArray(o)){
      for(const it of o) s += pad + "- " + this._inlineOrScalar(it) + "\n";
      return s;
    }
    for(const k in o){
      const v = o[k];
      if(v && typeof v === "object" && !Array.isArray(v) && !this._isFlat(v)){
        s += pad + k + ":\n" + this._block(v, ind+1);
      } else if(Array.isArray(v) && this._arrNeedsBlock(v)){
        s += pad + k + ":\n" + this._block(v, ind+1);
      } else {
        s += pad + k + ": " + this._inlineOrScalar(v) + "\n";
      }
    }
    return s;
  },
  _isFlat(o){ // 객체가 스칼라만? -> 인라인 {}
    if(Array.isArray(o)) return false;
    return Object.values(o).every(v => typeof v !== "object" || v === null);
  },
  _arrNeedsBlock(a){ // 원소가 map(스칼라 여러개) 이고 nested list 아니면 block(- {..})
    return a.some(x => x && typeof x === "object" && !Array.isArray(x)) &&
           !a.some(x => Array.isArray(x));
  },
  _inlineOrScalar(v){
    if(v === null || v === undefined) return "";
    if(Array.isArray(v)) return this._flow(v);
    if(typeof v === "object") return this._flow(v);
    return this._scalar(v);
  },
  _flow(v){
    if(Array.isArray(v)) return "[" + v.map(x=>this._inlineOrScalar(x)).join(", ") + "]";
    return "{ " + Object.entries(v).map(([k,x])=>k+": "+this._inlineOrScalar(x)).join(", ") + " }";
  },
  _scalar(v){
    if(typeof v === "string"){ return /[:#\[\]{}",]|^\s|\s$/.test(v) ? JSON.stringify(v) : v; }
    return String(v);
  },
  // ---- parse ----
  parse(text){
    const lines = text.replace(/\t/g,"  ").split("\n")
      .map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim()!=="" && !/^\s*#/.test(l));
    let i = 0;
    const peekInd = ()=> i<lines.length ? lines[i].match(/^ */)[0].length : -1;
    const self = this;
    function parseBlock(ind){
      // list?
      if(i<lines.length && lines[i].slice(ind).startsWith("- ")) return parseList(ind);
      const obj = {};
      while(i<lines.length){
        const cur = lines[i]; const cind = cur.match(/^ */)[0].length;
        if(cind < ind) break;
        if(cind > ind){ i++; continue; }
        const m = cur.slice(ind).match(/^([^:]+):(.*)$/);
        if(!m){ i++; continue; }
        const key = m[1].trim(); const rest = m[2].trim();
        i++;
        if(rest === ""){
          const childInd = peekInd();
          if(childInd > ind || (i<lines.length && lines[i].slice(childInd).startsWith("- ") && childInd>=ind)){
            obj[key] = parseBlock(childInd > ind ? childInd : ind + 2);
          } else obj[key] = null;
        } else {
          obj[key] = self._parseFlowOrScalar(rest);
        }
      }
      return obj;
    }
    function parseList(ind){
      const arr = [];
      while(i<lines.length){
        const cur = lines[i]; const cind = cur.match(/^ */)[0].length;
        if(cind < ind || !cur.slice(ind).startsWith("- ")) break;
        const rest = cur.slice(ind+2).trim();
        i++;
        if(rest === ""){ arr.push(parseBlock(peekInd())); }
        else arr.push(self._parseFlowOrScalar(rest));
      }
      return arr;
    }
    return parseBlock(peekInd());
  },
  _parseFlowOrScalar(s){
    s = s.trim();
    if(s.startsWith("[") || s.startsWith("{")) return this._parseFlow(s);
    return this._parseScalar(s);
  },
  _parseFlow(s){
    let i = 0;
    function ws(){ while(i<s.length && /\s/.test(s[i])) i++; }
    function val(){
      ws();
      if(s[i]==="["){ i++; const a=[]; ws(); if(s[i]==="]"){i++;return a;}
        while(true){ a.push(val()); ws(); if(s[i]===","){i++;continue;} if(s[i]==="]"){i++;break;} break; } return a; }
      if(s[i]==="{"){ i++; const o={}; ws(); if(s[i]==="}"){i++;return o;}
        while(true){ ws(); let k=""; while(i<s.length && s[i]!==":"){k+=s[i++];} i++; o[k.trim()]=val();
          ws(); if(s[i]===","){i++;continue;} if(s[i]==="}"){i++;break;} break; } return o; }
      if(s[i]==='"'){ let j=i+1,str=""; while(j<s.length&&s[j]!=='"'){str+=s[j++];} i=j+1; return str; }
      let t=""; while(i<s.length && !/[,\]}]/.test(s[i])){t+=s[i++];}
      return YAML._parseScalar(t.trim());
    }
    return val();
  },
  _parseScalar(s){
    if(s===""||s==null) return null;
    if(s[0]==='"'&&s[s.length-1]==='"') return JSON.parse(s);
    if(s==="true")return true; if(s==="false")return false;
    if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s)) return parseFloat(s);
    return s;
  }
};

// ============================ 기본 구조(state) ============================
const DEFAULT = {
  product:"qcell_demo",
  grid:{ pixel_pitch_um:1.0, n_pixels:4, dxy_um:0.02, dz_um:0.02, air_margin_um:0.20 },
  materials:{
    air:{n:1.00,k:0.00}, si:{n:4.08,k:0.028}, oxide:{n:1.46,k:0.00},
    dti_metal:{n:0.40,k:3.40}, arl_hi:{n:2.20,k:0.00}, arl_lo:{n:1.46,k:0.00},
    grid_metal:{n:0.40,k:3.40}, cf_red:{n:1.65,k:0.02}, cf_green:{n:1.65,k:0.02},
    cf_blue:{n:1.65,k:0.02}, ml:{n:1.60,k:0.00}, ml_arl:{n:1.25,k:0.00}
  },
  bayer:[["R","G","R","G"],["G","B","G","B"],["R","G","R","G"],["G","B","G","B"]],
  stack:{
    si_substrate:{ thickness_um:2.0, material:"si" },
    dti:{ depth_um:0.50, wall_width_um:0.15, oxide_liner_um:0.02, liner:"oxide", fill:"si", center_open:true, center_gap_um:0.20 },
    arl_bottom:[ {material:"arl_hi",thickness_um:0.02}, {material:"arl_lo",thickness_um:0.05} ],
    color_filter:{ thickness_um:0.60,
      grid:{ pitch:1, top_width_um:0.10, bottom_width_um:0.18, oxide_coat:true, oxide_wrap_um:0.02,
        stack:[ {material:"grid_metal",thickness_um:0.30}, {material:"grid_metal",thickness_um:0.30} ] } },
    ml_planar:{ thickness_um:0.30, material:"ml" },
    microlens:{ sag_height_um:0.55, material:"ml",
      quads:[[{shape:"2x2"},{shape:"2x1",orient:"h"}],[{shape:"2x1",orient:"v"},{shape:"1x1"}]] },
    arl_top:[ {material:"ml_arl",thickness_um:0.10} ]
  }
};
// 자동 저장(localStorage) 복원 + ref 파장 + 폴더 물질 라이브러리(파장별 n,k)
let refLambda = 0.55;
let folderLib = {};        // { 물질명: [[lam_um,n,k],...] }  materials 폴더에서 로드
let S = (function(){ try{ const j=localStorage.getItem("cis_struct_v1");
    if(j){ const d=JSON.parse(j); if(d.refLambda) refLambda=d.refLambda; if(d.folderLib) folderLib=d.folderLib; if(d.S) return d.S; } }catch(e){}
  return structuredClone(DEFAULT); })();
function saveState(){ try{ localStorage.setItem("cis_struct_v1", JSON.stringify({S,refLambda,folderLib})); }catch(e){} }
function interp1(x,xs,ys){ if(x<=xs[0])return ys[0]; const n=xs.length; if(x>=xs[n-1])return ys[n-1];
  for(let i=1;i<n;i++){ if(x<=xs[i]){ const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]); } } return ys[n-1]; }
// 물질의 n,k 테이블 소스: src 지정 폴더파일 -> 동일이름 폴더파일 -> inline nk -> 없음
function matTable(name){ const m=S.materials[name]||{};
  if(m.src && folderLib[m.src]) return folderLib[m.src];
  if(folderLib[name]) return folderLib[name];
  if(m.nk && m.nk.length) return m.nk;
  return null; }
// 물질 (n,k) @ refLambda
function matNK(name){ const m=S.materials[name]||{n:1,k:0}; const tab=matTable(name);
  if(tab && tab.length){ const L=tab.map(r=>r[0]); return {n:interp1(refLambda,L,tab.map(r=>r[1])), k:interp1(refLambda,L,tab.map(r=>r[2]))}; }
  return {n:+m.n||0, k:+m.k||0}; }
function parseNKText(txt){ const rows=[];
  txt.split(/\r?\n/).forEach(l=>{ l=l.trim(); if(!l||l[0]==="#")return; const p=l.replace(/,/g," ").split(/\s+/).map(Number);
    if(p.length>=3&&p.slice(0,3).every(v=>!isNaN(v))) rows.push(p.slice(0,3)); });
  if(!rows.length)return null; rows.sort((a,b)=>a[0]-b[0]);
  const maxL=Math.max(...rows.map(r=>r[0])), sc=maxL>100?0.001:1;   // nm->um 자동
  return rows.map(r=>[r[0]*sc,r[1],r[2]]); }

// ============================ 물질 표시색 ============================
function matColor(name){
  const M={air:"#e9f1fb",si:"#3b3b3b",oxide:"#bcd4e6",dti_metal:"#141414",grid_metal:"#141414",
    arl_hi:"#8b6fd0",arl_lo:"#a9c7d6",cf_red:"#e24a4a",cf_green:"#3fb34f",cf_blue:"#3f6fd0",
    ml:"#f2c14e",ml_arl:"#d9b3ff"};
  if(M[name]) return M[name];
  if(/red/.test(name))return"#e24a4a"; if(/green/.test(name))return"#3fb34f"; if(/blue/.test(name))return"#3f6fd0";
  if(/metal|dti|grid/.test(name))return"#141414"; if(/oxide|arl_lo/.test(name))return"#bcd4e6";
  if(/arl/.test(name))return"#8b6fd0"; if(/ml/.test(name))return"#f2c14e"; if(/si/.test(name))return"#3b3b3b";
  return"#9aa";
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// ============================ 구조 도우미 ============================
const P = ()=>S.grid.pixel_pitch_um, NP = ()=>S.grid.n_pixels;
function stackTotalGrid(){ return S.stack.color_filter.grid.stack.reduce((a,s)=>a+ +s.thickness_um,0); }
function colorMat(c){ return {R:"cf_red",G:"cf_green",B:"cf_blue"}[c]; }
// Grid 물질 판정: x(um), zf(0=아래..1=위) -> 물질명 | null(CF).  taper + 다층 + oxide 코팅
function gridMatAt(x, zf){
  const g=S.stack.color_filter.grid, p=P();
  const per=(g.pitch||1)*p, tw=+g.top_width_um, bw=+g.bottom_width_um;
  const ow=g.oxide_coat? +(g.oxide_wrap_um||0):0;
  const w=bw+(tw-bw)*zf;                                  // 위 얇고 아래 두꺼움
  const d=Math.abs(x-Math.round(x/per)*per);
  if(d>w/2+ow) return null;                               // CF 영역
  if(d>w/2) return "oxide";                               // 표면 oxide 코팅
  const H=stackTotalGrid(); let zz=zf*H, acc=0;           // 다층: zf 로 sublayer 결정
  for(const sub of g.stack){ acc+=+sub.thickness_um; if(zz<=acc+1e-9) return sub.material; }
  return g.stack.length? g.stack[g.stack.length-1].material : "grid_metal";
}

// ML sag (단면/topview 공용): (x,y) um -> 표면 높이(um)
function mlSag(x,y){
  const p=P(), h=+S.stack.microlens.sag_height_um, quads=S.stack.microlens.quads;
  let sag=0;
  function dome(cx,cy,ax,ay){ const r=((x-cx)/ax)**2+((y-cy)/ay)**2; if(r<=1) sag=Math.max(sag,h*Math.sqrt(1-r)); }
  for(let qy=0;qy<2;qy++)for(let qx=0;qx<2;qx++){
    const s=quads[qy][qx], x0=qx*2*p,y0=qy*2*p,cx0=x0+p,cy0=y0+p, sh=s.shape, or=s.orient||"h";
    if(sh==="2x2") dome(cx0,cy0,p,p);
    else if(sh==="1x1"){for(let a=0;a<2;a++)for(let b=0;b<2;b++)dome(x0+(b+.5)*p,y0+(a+.5)*p,p/2,p/2);}
    else if(sh==="2x1"){ if(or==="h"){for(let a=0;a<2;a++)dome(cx0,y0+(a+.5)*p,p,p/2);}
      else {for(let b=0;b<2;b++)dome(x0+(b+.5)*p,cy0,p/2,p);} }
  }
  return sag;
}
// 경계 위치 판정
function nearBoundary(coord, w){ const p=P(); const u=((coord%p)+p)%p; const h=w/2; return u<h||u>p-h; }
// DTI 물질 판정 -> 물질명 | null(Si)
// 모델: Si -> 트렌치 식각(center-open 사각형) -> 사이드월 oxide 라이너 -> 안쪽 Si 채움
function dtiAt(x,y){
  const p=P(), st=S.stack.dti, ol=+st.oxide_liner_um, W=+st.wall_width_um, ox=st.liner||"oxide";
  // 1) center: 안 뚫음(식각 X) -> 순수 Si. 오직 트렌치에만 oxide 형성.
  if(st.center_open){
    const gh=(+st.center_gap_um||0)/2;
    const oddIdx=v=>{ const i=Math.round(v/p); return (i%2!==0)?i:(v>i*p?i+1:i-1); };
    const cx=oddIdx(x)*p, cy=oddIdx(y)*p;
    if(Math.abs(x-cx)<gh && Math.abs(y-cy)<gh) return null;   // pure Si (center 안 뚫음)
  }
  // 2) 트렌치(모든 pixel 경계, 폭 W): 사이드월 ol 만 oxide, 안쪽은 Si 채움
  const dx=Math.abs(x-Math.round(x/p)*p), dy=Math.abs(y-Math.round(y/p)*p), d=Math.min(dx,dy);
  if(d>=W/2) return null;                       // Si 기판
  return (d > W/2 - ol) ? ox : null;            // 사이드월 oxide 라이너 / Si 채움
}

// ============================ 렌더: XZ 단면 ============================
function totalHeight(){
  const s=S.stack;
  const arlB=s.arl_bottom.reduce((a,l)=>a+ +l.thickness_um,0);
  const arlT=s.arl_top.reduce((a,l)=>a+ +l.thickness_um,0);
  return +s.si_substrate.thickness_um + arlB +               // DTI 는 substrate 내 식각(별도 두께 X)
    Math.max(+s.color_filter.thickness_um, stackTotalGrid()) + +s.ml_planar.thickness_um +
    +s.microlens.sag_height_um + arlT + +S.grid.air_margin_um;
}
function drawXZ(){
  const cv=document.getElementById("xz"), ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css("--panel"); ctx.fillRect(0,0,W,H);
  const p=P(), np=NP(), span=p*np;
  const s=S.stack;
  const arlB=s.arl_bottom.reduce((a,l)=>a+ +l.thickness_um,0);
  const arlTtot=s.arl_top.reduce((a,l)=>a+ +l.thickness_um,0);
  const cfH=Math.max(+s.color_filter.thickness_um, stackTotalGrid());
  const Htot=+s.si_substrate.thickness_um+arlB+cfH+ +s.ml_planar.thickness_um
    + +s.microlens.sag_height_um+arlTtot+ +S.grid.air_margin_um;
  const padL=44,padB=26,padT=10,padR=10;
  const sx=(W-padL-padR)/span, sz=(H-padB-padT)/Htot;
  const X=x=>padL+x*sx, Z=z=>H-padB-z*sz;   // z up
  const cutY=+document.getElementById("cutY").value;   // um

  function rect(x0,x1,z0,z1,col){ ctx.fillStyle=col; ctx.fillRect(X(x0),Z(z1),(x1-x0)*sx,(z1-z0)*sz); }
  // 배경 air
  rect(0,span,0,Htot,matColor("air"));

  let z=0;
  // 1) Si substrate (DTI 는 별도 밴드가 아니라 이 substrate 상단 depth 에 식각됨)
  const siTh=+s.si_substrate.thickness_um, dth=Math.min(+s.dti.depth_um, siTh);
  rect(0,span,z,z+siTh, matColor(s.si_substrate.material));   // 전체 Si
  // DTI: substrate 상단 depth 구간 [siTh-dth, siTh] 에 트렌치(oxide 라이너)만 rasterize
  { const wpx=Math.round((W-padL-padR));
    for(let px=0;px<wpx;px++){ const x=px/sx; const m=dtiAt(x,cutY); if(!m) continue;
      ctx.fillStyle=matColor(m); ctx.fillRect(padL+px, Z(siTh), 1, dth*sz); } }
  z+=siTh;
  // 3) ARL bottom (blanket 다층)
  for(const l of s.arl_bottom){ rect(0,span,z,z+ +l.thickness_um,matColor(l.material)); z+=+l.thickness_um; }
  // 4) CF + grid  (CF 색 배경 위에 grid 를 taper/다층/oxide코팅 rasterize)
  { const rowIdx=Math.max(0,Math.min(np-1,Math.floor(cutY/p)));
    for(let c=0;c<np;c++) rect(c*p,(c+1)*p,z,z+ +s.color_filter.thickness_um,matColor(colorMat(S.bayer[rowIdx][c])));
    const gt=stackTotalGrid(), wpx=Math.round(W-padL-padR), hpx=Math.max(1,Math.round(gt*sz));
    for(let px=0;px<wpx;px++){ const x=px/sx;
      for(let pz=0;pz<hpx;pz++){ const zf=1-(pz+0.5)/hpx; const m=gridMatAt(x,zf); if(!m) continue;
        ctx.fillStyle=matColor(m); ctx.fillRect(padL+px, Z(z+gt)+pz, 1, 1); } } }
  z+=cfH;
  // 5) ML planar
  rect(0,span,z,z+ +s.ml_planar.thickness_um,matColor(s.ml_planar.material)); z+=+s.ml_planar.thickness_um;
  // 6) Microlens dome (cutY 라인 프로파일)
  const ml0=z, mlmat=matColor(s.microlens.material);
  { ctx.fillStyle=mlmat; ctx.beginPath(); let started=false;
    const N=240; let prevTop=z;
    for(let i2=0;i2<=N;i2++){ const x=span*i2/N; const sg=mlSag(x,cutY); const top=z+sg;
      if(i2===0){ctx.moveTo(X(x),Z(z));} ctx.lineTo(X(x),Z(top)); }
    ctx.lineTo(X(span),Z(z)); ctx.closePath(); ctx.fill(); }
  // 7) ARL top (dome 표면 위 conformal 근사)
  { let off=0; for(const l of s.arl_top){ const t=+l.thickness_um;
      ctx.strokeStyle=matColor(l.material); ctx.lineWidth=Math.max(1,t*sz);
      ctx.beginPath(); const N=240;
      for(let i2=0;i2<=N;i2++){ const x=span*i2/N; const top=z+mlSag(x,cutY)+off+t/2;
        i2? ctx.lineTo(X(x),Z(top)) : ctx.moveTo(X(x),Z(top)); } ctx.stroke(); off+=t; } }

  // 축
  ctx.strokeStyle=css("--line"); ctx.lineWidth=1; ctx.strokeRect(padL,padT,W-padL-padR,H-padB-padT);
  ctx.fillStyle=css("--ink-dim"); ctx.font="10px "+css("--mono");
  ctx.fillText("x [µm]",W/2-14,H-8);
  ctx.save(); ctx.translate(12,H/2); ctx.rotate(-Math.PI/2); ctx.fillText("z [µm]",0,0); ctx.restore();
  // 눈금
  ctx.fillStyle=css("--ink-faint");
  for(let x=0;x<=span+1e-6;x+=p){ ctx.fillText(x.toFixed(0),X(x)-3,H-14); }
  document.getElementById("xzCap").textContent=`XZ cross-section @ y=${cutY.toFixed(2)}µm   (total ${Htot.toFixed(2)}µm)`;
}

// ============================ 렌더: top-views ============================
function drawTop(id, fn){
  const cv=document.getElementById(id), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H); const p=P(),np=NP(),span=p*np; const pad=8;
  const sc=Math.min(W-2*pad,H-2*pad)/span; const ox=(W-span*sc)/2, oy=(H-span*sc)/2;
  const X=x=>ox+x*sc, Y=y=>H-oy-y*sc;
  fn(ctx,{X,Y,sc,p,np,span});
  ctx.strokeStyle=css("--line"); ctx.strokeRect(ox,oy,span*sc,span*sc);
}
function renderTops(){
  const p=P(),np=NP();
  // DTI: rasterize (metal/oxide/Si). center open = 사각 window + oxide 코팅
  drawTop("tvDti",(ctx,g)=>{
    ctx.fillStyle=matColor(S.stack.dti.fill);
    ctx.fillRect(g.X(0),g.Y(g.span),g.span*g.sc,g.span*g.sc);
    const x0=g.X(0), y0=g.Y(g.span), side=g.span*g.sc, N=Math.round(side);
    for(let py=0;py<N;py++)for(let px=0;px<N;px++){
      const xu=px/g.sc, yu=(N-1-py)/g.sc; const m=dtiAt(xu,yu); if(!m) continue;
      ctx.fillStyle=matColor(m); ctx.fillRect(x0+px, y0+py, 1, 1); }
  });
  // CF + grid (per-pixel)
  drawTop("tvCf",(ctx,g)=>{
    for(let r=0;r<np;r++)for(let c=0;c<np;c++){ ctx.fillStyle=matColor(colorMat(S.bayer[r][c]));
      ctx.fillRect(g.X(c*p)+1,g.Y((r+1)*p)+1,p*g.sc-2,p*g.sc-2); }
    const gr=S.stack.color_filter.grid, per=(gr.pitch||1)*p, wm=+gr.bottom_width_um,
          ow=gr.oxide_coat?+(gr.oxide_wrap_um||0):0, w=wm+2*ow, gm=gr.stack[0]?gr.stack[0].material:"grid_metal";
    for(let c=0;c<=g.span+1e-6;c+=per){
      ctx.fillStyle=matColor("oxide"); ctx.fillRect(g.X(c-w/2),g.Y(g.span),w*g.sc,g.span*g.sc); ctx.fillRect(g.X(0),g.Y(c+w/2),g.span*g.sc,w*g.sc);
      ctx.fillStyle=matColor(gm); ctx.fillRect(g.X(c-wm/2),g.Y(g.span),wm*g.sc,g.span*g.sc); ctx.fillRect(g.X(0),g.Y(c+wm/2),g.span*g.sc,wm*g.sc);
    }
  });
  // ML height
  drawTop("tvMl",(ctx,g)=>{
    const N=90, h=+S.stack.microlens.sag_height_um;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){ const x=g.span*(i+.5)/N,y=g.span*(j+.5)/N;
      const sg=mlSag(x,y); if(sg<=0)continue; const t=sg/h;
      ctx.fillStyle=`rgba(242,193,78,${0.15+0.85*t})`;
      ctx.fillRect(g.X(g.span*i/N),g.Y(g.span*(j+1)/N),g.span/N*g.sc+1,g.span/N*g.sc+1); }
  });
}

function renderLegend(){
  const used=new Set(["air","si","oxide"]);
  used.add(S.stack.dti.liner||"oxide"); used.add(S.stack.dti.fill);
  S.stack.arl_bottom.forEach(l=>used.add(l.material));
  ["cf_red","cf_green","cf_blue"].forEach(c=>used.add(c));
  S.stack.color_filter.grid.stack.forEach(l=>used.add(l.material));
  used.add(S.stack.ml_planar.material); used.add(S.stack.microlens.material);
  S.stack.arl_top.forEach(l=>used.add(l.material));
  const el=document.getElementById("legend"); el.innerHTML="";
  [...used].forEach(n=>{ const s=document.createElement("span");
    s.innerHTML=`<i style="background:${matColor(n)}"></i>${n}`; el.appendChild(s); });
}
function render(){ drawXZ(); renderTops(); renderLegend();
  document.getElementById("dims").textContent=
    `pitch ${P()}µm · ${NP()}×${NP()} px · grid stack ${stackTotalGrid().toFixed(2)}µm · total ${totalHeight().toFixed(2)}µm`;
  saveState();      // 편집상태 자동 저장
}

// ============================ UI 빌드 ============================
function h(tag,attrs,kids){ const e=document.createElement(tag);
  for(const k in (attrs||{})){ if(k==="html")e.innerHTML=attrs[k]; else if(k.startsWith("on"))e[k]=attrs[k]; else e.setAttribute(k,attrs[k]); }
  (kids||[]).forEach(c=>e.appendChild(typeof c==="string"?document.createTextNode(c):c)); return e; }
function numRow(label, obj, key, step){
  const inp=h("input",{type:"number",step:step||"0.01",value:obj[key]});
  inp.oninput=()=>{ obj[key]=parseFloat(inp.value); render(); };
  return h("div",{class:"row"},[h("label",{},[label]),inp]);
}
function matSelect(obj,key){ const sel=h("select",{});
  Object.keys(S.materials).forEach(m=>{ const o=h("option",{value:m},[m]); if(obj[key]===m)o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{obj[key]=sel.value;render();}; return sel; }
function card(title, open, bodyKids){
  const d=h("details",{class:"card"}); if(open)d.setAttribute("open","");
  d.appendChild(h("summary",{},[title])); d.appendChild(h("div",{class:"body"},bodyKids)); return d; }

function sublistEditor(arr, withMaterial){
  const box=h("div",{class:"sublist"});
  function redraw(){ box.innerHTML="";
    arr.forEach((it,idx)=>{ const row=h("div",{class:"subrow"});
      if(withMaterial) row.appendChild(matSelect(it,"material"));
      const th=h("input",{type:"number",step:"0.01",value:it.thickness_um});
      th.oninput=()=>{it.thickness_um=parseFloat(th.value);render();};
      row.appendChild(th); row.appendChild(h("span",{class:"hint"},["µm"]));
      const del=h("button",{class:"del",onclick:()=>{arr.splice(idx,1);redraw();render();}},["✕"]);
      row.appendChild(del); box.appendChild(row); });
    const add=h("button",{class:"btn mini",onclick:()=>{arr.push(withMaterial?{material:Object.keys(S.materials)[0],thickness_um:0.05}:{thickness_um:0.05});redraw();render();}},["+ add layer"]);
    box.appendChild(add);
  }
  redraw(); return box;
}

  const side=document.getElementById("side"); side.innerHTML="";

  // Global
  side.appendChild(card("Global", false,[
    numRow("pixel pitch (µm)",S.grid,"pixel_pitch_um"),
    numRow("n pixels",S.grid,"n_pixels","1"),
    numRow("dxy (µm)",S.grid,"dxy_um"),
    numRow("dz (µm)",S.grid,"dz_um"),
    numRow("air margin (µm)",S.grid,"air_margin_um"),
    (()=>{ const inp=h("input",{type:"number",step:"0.05",value:cutYState.v});
      inp.id="cutY"; inp.oninput=()=>{cutYState.v=parseFloat(inp.value);render();};
      return h("div",{class:"row"},[h("label",{},["XZ cut y (µm)"]),inp]); })(),
  ]));

  // Materials (파장의존 n,k)
  const refRow=h("div",{class:"row"},[h("label",{},["ref λ (µm) · n,k 표시"]),
    (()=>{const i=h("input",{type:"number",step:"0.01",value:refLambda});
      i.oninput=()=>{refLambda=parseFloat(i.value);buildSide();render();};return i;})()]);
  const loadBtn=h("button",{class:"btn mini",onclick:()=>document.getElementById("matFolder").click()},["📁 Load materials folder (.txt)"]);
  const folderNames=Object.keys(folderLib);
  const mtbl=h("table",{}); mtbl.appendChild(h("tr",{},[h("th",{},["구조 물질"]),h("th",{},["n,k 파일 (폴더)"]),h("th",{},["n"]),h("th",{},["k"]),h("th",{},[""])]));
  Object.entries(S.materials).forEach(([name,mk])=>{ const tr=h("tr",{class:"mat"});
    tr.appendChild(h("td",{},[name]));
    // n,k 파일 선택 (폴더 물질)
    const sel=h("select",{}); sel.style.width="100%";
    const cur = (mk.src&&folderLib[mk.src])?mk.src : (folderLib[name]?name:"(const)");
    [["(const)","(상수)"], ...folderNames.map(fn=>[fn,fn])].forEach(([v,t])=>{ const o=h("option",{value:v},[t]); if(cur===v)o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ mk.src = sel.value==="(const)"?undefined:sel.value; buildSide(); render(); };
    tr.appendChild(h("td",{},[sel]));
    const at=matNK(name), hasTab=!!matTable(name);
    if(hasTab){ tr.appendChild(h("td",{},[at.n.toFixed(3)])); tr.appendChild(h("td",{},[at.k.toFixed(3)])); }
    else { const ni=h("input",{type:"number",step:"0.01",value:mk.n}); ni.oninput=()=>{mk.n=parseFloat(ni.value);render();};
      const ki=h("input",{type:"number",step:"0.001",value:mk.k}); ki.oninput=()=>{mk.k=parseFloat(ki.value);render();};
      tr.appendChild(h("td",{},[ni])); tr.appendChild(h("td",{},[ki])); }
    tr.appendChild(h("td",{},[h("button",{class:"del",onclick:()=>{delete S.materials[name];buildSide();render();}},["✕"])]));
    mtbl.appendChild(tr); });
  const addMat=h("div",{class:"row"},[ (()=>{const i=h("input",{type:"text",placeholder:"new material name",id:"newmat"});i.style.flex="1";return i;})(),
    h("button",{class:"btn mini",onclick:()=>{const nm=document.getElementById("newmat").value.trim(); if(nm&&!S.materials[nm]){S.materials[nm]={n:1.5,k:0};buildSide();render();}}},["+ add"]) ]);
  side.appendChild(card("Materials (구조물질 ↔ 폴더 n,k)", false,[refRow,loadBtn,mtbl,addMat,
    h("p",{class:"hint"},["각 구조 물질에 폴더의 n,k 파일을 지정(예: Si→si.txt). ref λ 에서의 n,k 표시. 📁 로 폴더 로드 후 이름 같으면 자동 매핑. 자동 저장(localStorage)."]) ]));

  // Si substrate
  const ss=S.stack.si_substrate;
  side.appendChild(card("① Si substrate", false,[ numRow("thickness (µm)",ss,"thickness_um"),
    h("div",{class:"row"},[h("label",{},["material"]),matSelect(ss,"material")]) ]));

  // DTI
  const dti=S.stack.dti;
  const coCk=h("input",{type:"checkbox"}); coCk.checked=dti.center_open; coCk.onchange=()=>{dti.center_open=coCk.checked;render();};
  side.appendChild(card("② Si DTI (isolation)", true,[
    numRow("depth (µm)",dti,"depth_um"), numRow("trench width (µm)",dti,"wall_width_um"),
    numRow("oxide liner (µm)",dti,"oxide_liner_um"),
    h("div",{class:"row"},[h("label",{},["oxide liner mat"]),matSelect(dti,"liner")]),
    h("div",{class:"row"},[h("label",{},["trench fill"]),matSelect(dti,"fill")]),
    h("div",{class:"row"},[h("label",{},["center open (2×2 Si 연결)"]),coCk]),
    numRow("center gap (µm)",dti,"center_gap_um"),
    h("p",{class:"hint"},["모델: 식각(center-open 사각) → 사이드월 oxide 라이너 → 안쪽 Si 채움. 개구 box 표면도 oxide."]),
  ]));

  // ARL bottom
  side.appendChild(card("③ ARL bottom (blanket 다층)", false,[
    h("p",{class:"hint"},["grid 분리 없는 전면 다층막 (아래→위)"]),
    sublistEditor(S.stack.arl_bottom, true) ]));

  // CF + grid
  const cf=S.stack.color_filter, gr=cf.grid;
  const gpit=h("select",{}); [["1","1×1 (pixel)"],["2","2×2 (quad)"]].forEach(([v,t])=>{const o=h("option",{value:v},[t]); if(String(gr.pitch||1)===v)o.selected=true; gpit.appendChild(o);});
  gpit.onchange=()=>{gr.pitch=parseInt(gpit.value); render();};
  const gcoat=h("input",{type:"checkbox"}); gcoat.checked=gr.oxide_coat!==false; gcoat.onchange=()=>{gr.oxide_coat=gcoat.checked; render();};
  side.appendChild(card("④ Color Filter + Grid", true,[
    numRow("CF thickness (µm)",cf,"thickness_um"),
    h("div",{class:"seclbl"},["grid"]),
    h("div",{class:"row"},[h("label",{},["grid pitch"]),gpit]),
    numRow("top width (µm)",gr,"top_width_um"),
    numRow("bottom width (µm)",gr,"bottom_width_um"),
    h("p",{class:"hint"},["보통 위가 얇고 아래가 두꺼움 (taper). height 는 아래 stack 합."]),
    h("div",{class:"row"},[h("label",{},["oxide 표면 코팅"]),gcoat]),
    numRow("oxide coat (µm)",gr,"oxide_wrap_um"),
    h("div",{class:"seclbl"},["grid stack (아래→위) · 동일물질 연결"]),
    sublistEditor(gr.stack, true),
  ]));

  // ML planar
  const mp=S.stack.ml_planar;
  side.appendChild(card("⑤ ML planar", false,[ numRow("thickness (µm)",mp,"thickness_um"),
    h("div",{class:"row"},[h("label",{},["material"]),matSelect(mp,"material")]) ]));

  // Microlens
  const ml=S.stack.microlens;
  const quadUI=h("div",{class:"sublist"});
  const POS=[[1,0,"TL"],[1,1,"TR"],[0,0,"BL"],[0,1,"BR"]];
  POS.forEach(([qy,qx,pos])=>{ const spec=ml.quads[qy][qx];
    const sel=h("select",{}); [["2x2","2×2"],["2x1h","2×1 h"],["2x1v","2×1 v"],["1x1","1×1"]].forEach(([v,t])=>{const o=h("option",{value:v},[t]);
      const cur=spec.shape==="2x1"?(spec.orient==="v"?"2x1v":"2x1h"):spec.shape; if(cur===v)o.selected=true; sel.appendChild(o);});
    sel.onchange=()=>{ const v=sel.value; ml.quads[qy][qx]= v==="2x1h"?{shape:"2x1",orient:"h"}:v==="2x1v"?{shape:"2x1",orient:"v"}:{shape:v}; render(); };
    quadUI.appendChild(h("div",{class:"subrow"},[h("span",{class:"hint",style:"width:26px"},[pos]),sel])); });
  side.appendChild(card("⑥ Microlens", false,[ numRow("sag height (µm)",ml,"sag_height_um"),
    h("div",{class:"row"},[h("label",{},["material"]),matSelect(ml,"material")]),
    h("div",{class:"seclbl"},["quad shape"]), quadUI,
    h("p",{class:"hint"},["세부 형상 변형은 ML shape editor 참조"]) ]));

  // ARL top
  side.appendChild(card("⑦ ARL top (air→ML)", false,[
    h("p",{class:"hint"},["ML 표면 위 AR 코팅 (아래→위)"]),
    sublistEditor(S.stack.arl_top, true) ]));
}
const cutYState={v:0.5};

// ============================ Import / Export ============================
const dlg=document.getElementById("dlg");
const matFolderInput=document.getElementById("matFolder");
matFolderInput.onchange=async(e)=>{ const files=[...e.target.files]; let n=0;
  for(const f of files){ if(!/\.txt$/i.test(f.name))continue; let txt; try{txt=await f.text();}catch(_){continue;}
    const nk=parseNKText(txt); if(!nk)continue; const name=f.name.replace(/\.txt$/i,"");
    folderLib[name]=nk; n++; }
  // 구조 물질 이름이 폴더 파일과 같으면 자동 매핑(src)
  for(const role in S.materials){ if(!S.materials[role].src && folderLib[role]) S.materials[role].src=role; }
  buildSide(); render(); e.target.value=""; alert(n+" 개 물질 n,k 파일 로드됨 (파장별)."); };

document.getElementById("exportBtn").onclick=()=>{
  // 파장별 n,k 테이블은 materials/ 폴더가 소스 -> YAML 에는 ref λ 상수값만
  const exp=structuredClone(S);
  for(const m in exp.materials){ const at=matNK(m), src=exp.materials[m].src;
    exp.materials[m]={n:+at.n.toFixed(4),k:+at.k.toFixed(4)}; if(src) exp.materials[m].src=src; }
  const pname=(S.product||"structure").trim().replace(/[^\w\-.]/g,"_")||"structure";
  const text=`# CIS structure · product: ${S.product||""}\n# 파장별 n,k 는 materials/ 폴더 txt 사용 (아래 n,k 는 λ=${refLambda}µm 상수 fallback)\n`+YAML.emit(exp);
  document.getElementById("dlgTitle").textContent=`Save · ${pname}.yaml`;
  document.getElementById("dlgHint").textContent=`conf/ 에 ${pname}.yaml 로 저장 → 파이프라인에서 -c conf/${pname}.yaml`;
  document.getElementById("dlgText").value=text;
  document.getElementById("dlgLoad").style.display="none";
  const blob=new Blob([text],{type:"text/yaml"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=pname+".yaml"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  dlg.showModal();
};
document.getElementById("importBtn").onclick=()=>{
  document.getElementById("dlgTitle").textContent="Import YAML";
  document.getElementById("dlgHint").textContent="YAML 붙여넣고 Load. (export 한 형식과 호환)";
  document.getElementById("dlgText").value=""; document.getElementById("dlgLoad").style.display="";
  dlg.showModal();
};
document.getElementById("dlgLoad").onclick=()=>{
  try{ const obj=YAML.parse(document.getElementById("dlgText").value);
    S=Object.assign(structuredClone(DEFAULT),obj);
    if(obj.stack) S.stack=Object.assign(structuredClone(DEFAULT.stack),obj.stack);
    buildSide(); render(); dlg.close();
  }catch(e){ alert("parse error: "+e.message); }
};
document.getElementById("dlgCopy").onclick=async()=>{ const t=document.getElementById("dlgText"); t.select();
  try{await navigator.clipboard.writeText(t.value);}catch(e){document.execCommand("copy");} };
document.getElementById("dlgClose").onclick=()=>dlg.close();
document.getElementById("themeBtn").onclick=()=>{ const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark"); render(); };

// ============================ product name ============================
const prodInput=document.getElementById("prodName");
prodInput.value=S.product||"";
prodInput.oninput=()=>{ S.product=prodInput.value; saveState(); };

// ============================ init ============================
buildSide(); render();
</script>
