<title>CIS Structure Wizard — step by step</title>
<style>
  :root{--bg:#0e1318;--panel:#161d24;--panel-2:#1b232b;--line:#26313b;--ink:#dbe6ee;--ink-dim:#8ea1af;--ink-faint:#5b6d7a;
    --accent:#35d1c4;--accent-dim:#1f7a72;--amber:#f2c14e;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  @media (prefers-color-scheme: light){:root{--bg:#eef2f4;--panel:#fff;--panel-2:#f4f7f8;--line:#dbe3e8;--ink:#16222b;--ink-dim:#54646f;--ink-faint:#8a9aa5;--accent:#118a80;--accent-dim:#8fded7;--amber:#c9902a;}}
  :root[data-theme="dark"]{--bg:#0e1318;--panel:#161d24;--panel-2:#1b232b;--line:#26313b;--ink:#dbe6ee;--ink-dim:#8ea1af;--ink-faint:#5b6d7a;--accent:#35d1c4;--accent-dim:#1f7a72;--amber:#f2c14e;}
  :root[data-theme="light"]{--bg:#eef2f4;--panel:#fff;--panel-2:#f4f7f8;--line:#dbe3e8;--ink:#16222b;--ink-dim:#54646f;--ink-faint:#8a9aa5;--accent:#118a80;--accent-dim:#8fded7;--amber:#c9902a;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;min-height:100vh}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand h1{font-size:15px;font-weight:650;margin:0}.brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .brand{display:flex;align-items:baseline;gap:9px}.spacer{flex:1}
  .btn{font-family:var(--ui);font-size:12.5px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn:hover{border-color:var(--accent-dim)}.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);color:#04211f;border-color:transparent;font-weight:600}.btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  input[type=text]{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .layout{display:flex;flex:1;min-height:0}
  .side{width:400px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .steps{display:flex;gap:4px;padding:12px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .schip{font-family:var(--mono);font-size:11px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;background:var(--panel-2)}
  .schip.on{background:var(--accent);color:#04211f;border-color:transparent;font-weight:700}
  .schip.done{border-color:var(--accent-dim);color:var(--accent)}
  .stepbody{flex:1;overflow-y:auto;padding:16px}
  .stepbody h2{font-size:14px;margin:0 0 4px}.stepbody .desc{font-size:12px;color:var(--ink-faint);margin:0 0 14px}
  .navrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .row label{font-size:12px;color:var(--ink-dim);flex:1}
  input[type=number]{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:92px;text-align:right}
  select{font-family:var(--ui);font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .sublist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .subrow{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .subrow select{flex:1}.subrow input{width:78px}
  .del{color:#d66;cursor:pointer;background:none;border:none;font-size:14px}
  .mini{font-size:11.5px;padding:5px 9px}
  .seclbl{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-faint);margin:10px 0 5px}
  .hint{font-size:11px;color:var(--ink-faint);line-height:1.5}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .viewtabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
  .vtab{font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim)}
  .vtab.on{color:var(--ink);border-color:var(--accent-dim)}
  .viewwrap{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  canvas{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:100%}
  .legend{display:flex;gap:11px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(128,128,128,.4)}
  .statusbar{border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);display:flex;gap:18px}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;max-width:min(720px,92vw)}
  dialog::backdrop{background:rgba(4,8,11,.55)}
  .dlg-h{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);gap:8px}
  .dlg-h h3{margin:0;font-size:13px}.dlg-b{padding:14px}
  textarea{width:100%;height:340px;font-family:var(--mono);font-size:11.5px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
</style>

<div class="topbar">
  <div class="brand"><h1>CIS Structure Wizard</h1><span class="sub">step by step → 3D → npy</span></div>
  <div class="spacer"></div>
  <input id="prodName" type="text" placeholder="product name" style="width:150px">
  <select id="viewQ" title="viewer 해상도 (npy 해상도는 step1 dxy/dz)" style="font-size:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px">
    <option value="1">뷰 보통</option><option value="2" selected>뷰 고품질</option>
  </select>
  <button class="btn ghost" id="themeBtn">◐</button>
  <button class="btn ghost" id="matBtn">📁 Materials</button>
  <button class="btn ghost" id="importBtn">⤒ Import</button>
  <button class="btn ghost" id="yamlBtn">⤓ YAML</button>
  <button class="btn primary" id="npyBtn">⤓ npy + yaml</button>
  <button class="btn primary" id="qeBtn">▶ QE 해석</button>
</div>

<div class="layout">
  <aside class="side">
    <div class="steps" id="steps"></div>
    <div class="stepbody" id="stepBody"></div>
    <div class="navrow">
      <button class="btn" id="backBtn">← Back</button>
      <div class="spacer"></div>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>
  </aside>
  <div class="stage">
    <div class="viewtabs">
      <span class="hint">3D: 드래그=회전 · 휠=줌</span>
      <label class="hint" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="cutChk"> 내부 절단</label>
      <button class="btn ghost mini" id="resetView">reset view</button>
      <div class="spacer"></div>
      <label class="hint" style="display:flex;gap:6px;align-items:center">cut <input type="number" id="cutY" step="0.05" value="0.5" style="width:70px"></label>
    </div>
    <div class="viewwrap" id="viewWrap" style="position:relative;padding:0;overflow:hidden">
      <canvas id="iso3d" style="position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0"></canvas>
      <div id="mini" style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px;pointer-events:none;gap:10px"></div>
    </div>
    <div class="statusbar" id="status"></div>
  </div>
</div>

<input type="file" id="matFolder" webkitdirectory directory multiple style="display:none">
<dialog id="dlg"><div class="dlg-h"><h3 id="dlgTitle">YAML</h3><div class="spacer"></div>
  <button class="btn ghost" id="dlgCopy">Copy</button><button class="btn ghost" id="dlgClose">Close</button></div>
  <div class="dlg-b"><p class="hint" id="dlgHint" style="margin:0 0 9px"></p><textarea id="dlgText" spellcheck="false"></textarea></div></dialog>

<!-- ===== QE 해석 패널: structure(현재 위저드 상태) -> RCWA 서버 -> QE 스펙트럼 ===== -->
<dialog id="qeDlg" style="width:min(880px,95vw)">
  <div class="dlg-h"><h3>▶ QE 해석 · structure → RCWA → QE</h3><div class="spacer"></div>
    <button class="btn ghost" id="qeCsv" disabled>⤓ CSV</button>
    <button class="btn ghost" id="qeClose">Close</button></div>
  <div class="dlg-b" style="display:flex;flex-direction:column;gap:10px">
    <div id="qeGuide" class="hint" style="display:none;white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px"></div>
    <div id="qeCtl" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label class="hint" style="display:flex;flex-direction:column;gap:3px">λ 시작 (µm)<input id="qeL0" type="number" step="0.01" value="0.40" style="width:76px"></label>
      <label class="hint" style="display:flex;flex-direction:column;gap:3px">λ 끝 (µm)<input id="qeL1" type="number" step="0.01" value="0.70" style="width:76px"></label>
      <label class="hint" style="display:flex;flex-direction:column;gap:3px">파장 수<input id="qeN" type="number" step="1" min="1" value="7" style="width:60px"></label>
      <label class="hint" style="display:flex;flex-direction:column;gap:3px" title="Fourier 차수 — metal grid 수렴에 101 이상 권장 (클수록 정확·느림)">nG<input id="qeNG" type="number" step="2" min="9" value="101" style="width:66px"></label>
      <label class="hint" style="display:flex;flex-direction:column;gap:3px" title="구조 격자 다운샘플 (클수록 빠르고 거침)">downsample<input id="qeDS" type="number" step="1" min="1" value="2" style="width:60px"></label>
      <label class="hint" style="display:flex;flex-direction:column;gap:3px">입사각 θ(°)<input id="qeTH" type="number" step="1" value="0" style="width:56px"></label>
      <button class="btn primary" id="qeRun">▶ Run</button>
      <button class="btn" id="qeStop" disabled>■ Stop</button>
    </div>
    <div style="height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;overflow:hidden">
      <div id="qeProg" style="height:100%;width:0%;background:var(--accent);transition:width .3s"></div></div>
    <div class="hint" id="qeNote">-</div>
    <div id="qeLegend" style="display:flex;gap:16px;font-size:12px;align-items:center"></div>
    <div style="position:relative">
      <canvas id="qeChart" width="820" height="340" style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel)"></canvas>
      <div id="qeTip" style="position:absolute;display:none;pointer-events:none;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px;line-height:1.5;z-index:3"></div>
    </div>
    <details><summary class="hint" style="cursor:pointer">결과 표 (표로 보기)</summary>
      <div id="qeTable" style="max-height:200px;overflow:auto;font:11px/1.7 var(--mono);margin-top:6px"></div></details>
  </div>
</dialog>

<script>
"use strict";
// ============================ 상태 ============================
const DEFAULT = {
  product:"qcell_demo",
  grid:{ pixel_pitch_um:1.0, n_pixels:4, dxy_um:0.02, dz_um:0.02, air_margin_um:0.20 },
  cf_array:"bayer",
  bayer:[["R","G","R","G"],["G","B","G","B"],["R","G","R","G"],["G","B","G","B"]],
  materials:{ air:{n:1,k:0}, si:{n:4.08,k:0.028}, oxide:{n:1.46,k:0}, arl_hi:{n:2.2,k:0}, arl_lo:{n:1.46,k:0},
    grid_metal:{n:0.4,k:3.4}, cf_red:{n:1.65,k:0.02}, cf_green:{n:1.65,k:0.02}, cf_blue:{n:1.65,k:0.02}, ml:{n:1.6,k:0}, ml_arl:{n:1.25,k:0} },
  stack:{
    si:{ material:"si", thickness_um:2.0 },
    dti:{ width_um:0.08, oxide_liner_um:0.01, liner:"oxide", fill:"si", mode:"2x2_open", center_open:true, center_gap_x_um:0.20, center_gap_y_um:0.20 },  // depth = si.thickness
    barl:[ {material:"arl_hi",thickness_um:0.02}, {material:"arl_lo",thickness_um:0.05} ],
    grid:{ pitch:1, width_um:0.02, top_ratio:1.0, coat_on:true, coat_material:"oxide", coat_um:0.02, stack:[ {material:"grid_metal",height_um:0.30}, {material:"grid_metal",height_um:0.30} ] },
    cf:{ R:{material:"cf_red",thickness_um:0.60,curvature_um:0}, G:{material:"cf_green",thickness_um:0.60,curvature_um:0}, B:{material:"cf_blue",thickness_um:0.60,curvature_um:0} },
    ml:{ material:"ml", planar_um:0.30, hr:0.55, height_um:0, sag_height_um:0.55,
         quads:[[{shape:"2x2",scale:1},{shape:"2x1",orient:"h",scale:1}],[{shape:"2x1",orient:"v",scale:1},{shape:"1x1",scale:1}]], lenses:null },
    arl_top:{ material:"ml_arl", thickness_um:0.10 },
  }
};
let refLambda=0.55, folderLib={}, curStep=0, viewMode="iso";
let S=(function(){ try{const j=localStorage.getItem("cis_wizard_v3"); if(j){const d=JSON.parse(j);
  if(d.refLambda)refLambda=d.refLambda; if(d.folderLib)folderLib=d.folderLib; if(d.S)return d.S;} }catch(e){} return structuredClone(DEFAULT); })();
// voxel 해상도 가드: 0.01~0.02µm (최소 피처 20nm 보존, nm급은 npy 용량만 세제곱 폭발)
function clampRes(){ const g=S.grid;
  g.dxy_um=Math.min(0.02,Math.max(0.01,+g.dxy_um||0.02));
  g.dz_um =Math.min(0.02,Math.max(0.01,+g.dz_um ||0.02)); }
clampRes();
function save(){ try{localStorage.setItem("cis_wizard_v3",JSON.stringify({S,refLambda,folderLib}));}catch(e){} }

// ============================ 물질 ============================
function interp1(x,xs,ys){ if(x<=xs[0])return ys[0]; const n=xs.length; if(x>=xs[n-1])return ys[n-1];
  for(let i=1;i<n;i++){ if(x<=xs[i]){const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]);} } return ys[n-1]; }
function matTable(name){ const m=S.materials[name]||{}; if(m.src&&folderLib[m.src])return folderLib[m.src]; if(folderLib[name])return folderLib[name]; if(m.nk&&m.nk.length)return m.nk; return null; }
function matNK(name){ const m=S.materials[name]||{n:1,k:0}; const t=matTable(name);
  if(t&&t.length){const L=t.map(r=>r[0]); return {n:interp1(refLambda,L,t.map(r=>r[1])),k:interp1(refLambda,L,t.map(r=>r[2]))};} return {n:+m.n||0,k:+m.k||0}; }
function parseNK(txt){ const rows=[]; txt.split(/\r?\n/).forEach(l=>{l=l.trim(); if(!l||l[0]==="#")return; const p=l.replace(/,/g," ").split(/\s+/).map(Number); if(p.length>=3&&p.slice(0,3).every(v=>!isNaN(v)))rows.push(p.slice(0,3));}); if(!rows.length)return null; rows.sort((a,b)=>a[0]-b[0]); const mx=Math.max(...rows.map(r=>r[0])),sc=mx>100?0.001:1; return rows.map(r=>[r[0]*sc,r[1],r[2]]); }
// jet 컬러맵 (0..1 -> hex) — import 물질 뷰어 색 자동 배정용
function jetHex(t){ t=Math.min(1,Math.max(0,t));
  const c=x=>Math.round(255*Math.min(Math.max(1.5-Math.abs(4*t-x),0),1));
  return "#"+[c(3),c(2),c(1)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
// import 순서대로 jet 를 순회하며 새 물질에 색 배정 (기존 배정 수 이어서)
function assignMatColor(name){ if(S.materials[name]&&S.materials[name].color)return;
  const idx=Object.values(S.materials).filter(m=>m&&m.color).length;
  if(S.materials[name])S.materials[name].color=jetHex((idx%12)/11);
  delete _rgbCache[name]; }
function matColor(name){ const m=S.materials[name];
  if(m&&m.color)return m.color;                      // import 물질: jet 자동 배정색
  const M={air:"#e9f1fb",si:"#3b3b3b",oxide:"#bcd4e6",grid_metal:"#141414",arl_hi:"#8b6fd0",arl_lo:"#a9c7d6",cf_red:"#e24a4a",cf_green:"#3fb34f",cf_blue:"#3f6fd0",ml:"#f2c14e",ml_arl:"#d9b3ff"};
  if(M[name])return M[name]; if(/red/.test(name))return"#e24a4a"; if(/green/.test(name))return"#3fb34f"; if(/blue/.test(name))return"#3f6fd0"; if(/metal/.test(name))return"#141414"; if(/oxide|arl_lo/.test(name))return"#bcd4e6"; if(/arl/.test(name))return"#8b6fd0"; if(/ml/.test(name))return"#f2c14e"; if(/si/.test(name))return"#3b3b3b";
  // 미배정 미지 물질: 이름 해시로 jet 고정색 (회색 없음)
  let h=0; for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
  return jetHex((h%12)/11); }
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const _rgbCache={};
function rgbOf(name){ if(_rgbCache[name])return _rgbCache[name];
  let h=matColor(name).replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return _rgbCache[name]=[(n>>16)&255,(n>>8)&255,n&255]; }
function rgbCss(v){ let h=css(v).trim().replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

// ============================ 구조 지오메트리 (xy 패턴 함수) ============================
const P=()=>+S.grid.pixel_pitch_um, NP=()=>+S.grid.n_pixels;
function gridStackH(){ return S.stack.grid.stack.reduce((a,s)=>a+ +s.height_um,0); }
function gridCoat(){ const g=S.stack.grid; return (g.coat_on!==false)?+(g.coat_um||0):0; }
function gridTotalH(){ return gridStackH()+gridCoat(); }   // 코팅 top cap 포함
function cfMaxH(){ return Math.max(S.stack.cf.R.thickness_um,S.stack.cf.G.thickness_um,S.stack.cf.B.thickness_um); }
function colorRole(c){ return {R:"cf_red",G:"cf_green",B:"cf_blue"}[c]; }
// CF array 패턴 생성: bayer(RGGB 픽셀) / tetra(2x2 quad 동일색, quad 단위 bayer)
function setBayer(type){ const np=NP(), rows=[];
  for(let r=0;r<np;r++){ const row=[];
    for(let c=0;c<np;c++){ let rr=r,cc=c;
      if(type==="tetra"){ rr=Math.floor(r/2); cc=Math.floor(c/2); }
      row.push((rr%2===0)?((cc%2===0)?"R":"G"):((cc%2===0)?"G":"B")); }
    rows.push(row); }
  S.bayer=rows; }
function bandH(){ return Math.max(cfMaxH(), gridTotalH()); }
// DTI: 물질명|null(Si)  (center 안 뚫음=Si, 트렌치=oxide 라이너 + fill). ol <= W/2
// DTI 모드: "1x1"(전체 격자) | "2x2"(quad 경계만) | "2x2_open"(클로버: intra-quad 팔이 중앙 못미쳐 끊김)
function dtiMode(){ const st=S.stack.dti; return st.mode || (st.center_open?"2x2_open":"1x1"); }
function dtiAt(x,y){ const p=P(),st=S.stack.dti,W=+st.width_um,ol=Math.min(+st.oxide_liner_um,W/2),ox=st.liner||"oxide",fl=st.fill||"si";
  const mode=dtiMode(), per=(mode==="2x2")?2*p:p;
  const dx=Math.abs(x-Math.round(x/per)*per), dy=Math.abs(y-Math.round(y/per)*per);
  let vAct=dx<W/2, hAct=dy<W/2, vEnd=false, hEnd=false;      // 수직/수평 트렌치
  if(mode==="2x2_open"){
    const gx=(+(st.center_gap_x_um!=null?st.center_gap_x_um:st.center_gap_um)||0)/2;

// Grid 울타리(fence): (x,y,zabs[um]) -> 물질명|null(셀 내부). taper: 하부 width 기준 상부 축소(0.8~1)
function gridAt(x,y,zabs){ const g=S.stack.grid,p=P(),per=(g.pitch||1)*p,W=+g.width_um,cw=gridCoat(),H=gridStackH();
  const ratio=Math.min(1,Math.max(0,+(g.top_ratio!=null?g.top_ratio:1)||0));
  const wz=W*(1-(1-ratio)*Math.min(zabs/Math.max(H,1e-9),1));   // 아래 W -> 위 W*ratio 선형

  if(d>wz/2+cw || zabs>H+cw) return null;
  if(cw>0 && (d>wz/2 || zabs>H)) return g.coat_material||"oxide";   // 표면 코팅 (옆+위)
  if(d>wz/2) return null;

// ===== ML 풍선(balloon) 모델 =====

function mlTemplateLenses(){ const p=P(),out=[],q=S.stack.ml.quads;
  for(let qy=0;qy<2;qy++)for(let qx=0;qx<2;qx++){ const sp=q[qy][qx],sc=+(sp.scale||1),x0=qx*2*p,y0=qy*2*p,cx=x0+p,cy=y0+p,sh=sp.shape,or=sp.orient||"h";

    else if(sh==="2x1"){ if(or==="h")for(let a=0;a<2;a++)add(`q${qy}${qx}_${a}`,cx,y0+(a+.5)*p,p,p/2);

// ============================ npy voxel 빌드 ============================
// planar band 높이: 평탄층 두께는 '최저 CF top' 기준. (tall CF/grid 는 덮도록 max)
function cfMinH(){ return Math.min(S.stack.cf.R.thickness_um,S.stack.cf.G.thickness_um,S.stack.cf.B.thickness_um); }

function cfTopMax(){ return Math.max(...["R","G","B"].map(c=>{const f=S.stack.cf[c],k=+(f.curvature_um||0);return +f.thickness_um+Math.max(2*k/3,-4*k/3);})); }

function matAt(x,y,zc,upto){ if(upto==null)upto=99; const s=S.stack,p=P(),np=NP();

    if(upto>=5){ const pr=Math.min(np-1,Math.floor(y/p)),pc=Math.min(np-1,Math.floor(x/p)),col=colorRole(S.bayer[pr][pc]);
      const cfc=s.cf[{cf_red:"R",cf_green:"G",cf_blue:"B"}[col]];

// ===== 지오메트리 캐시: 무거운 2D 맵(dti/fence/cf/sag)을 1회 계산 -> 모든 뷰 O(1) 조회 =====
let GC=null, GCgen=0;
async function buildGC(){ const gen=++GCgen;
  const p=P(),np=NP(),span=p*np,st=S.stack;
  const N=1000, d=span/N, nP=N*N;
  const siM=new Uint8Array(nP), gD=new Float32Array(nP), cfT=new Float32Array(nP),
        cfI=new Uint8Array(nP), sg=new Float32Array(nP);
  const names=[]; const nid={}; const idOf=n=>{ if(!(n in nid)){nid[n]=names.length;names.push(n);} return nid[n]; };
  const g=st.grid, per=(g.pitch||1)*p, cfPer=((S.cf_array==="tetra")?2:1)*p;
  const th={R:+st.cf.R.thickness_um,G:+st.cf.G.thickness_um,B:+st.cf.B.thickness_um};
  const cvv={R:+(st.cf.R.curvature_um||0),G:+(st.cf.G.curvature_um||0),B:+(st.cf.B.curvature_um||0)};
  const cfIds={R:idOf(st.cf.R.material),G:idOf(st.cf.G.material),B:idOf(st.cf.B.material)};
  for(let j=0;j<N;j++){ const y=(j+0.5)*d;
    for(let i=0;i<N;i++){ const x=(i+0.5)*d, k=j*N+i;
      const dm=dtiAt(x,y); siM[k]=idOf(dm||st.si.material);
      gD[k]=Math.min(Math.abs(x-Math.round(x/per)*per), Math.abs(y-Math.round(y/per)*per));
      const pr=Math.min(np-1,Math.floor(y/p)), pc=Math.min(np-1,Math.floor(x/p)), col=S.bayer[pr][pc];
      const u=(x-(Math.floor(x/cfPer)+0.5)*cfPer)/(cfPer/2), v=(y-(Math.floor(y/cfPer)+0.5)*cfPer)/(cfPer/2);
      cfT[k]=Math.max(0.002, th[col]+cvv[col]*(2/3-(u*u+v*v)));

    if((j&63)===63){ if(gen!==GCgen)return null; await new Promise(r=>setTimeout(r,0)); if(gen!==GCgen)return null; } }

  { const hu=+(st.ml.height_um||0), hr0=mlHR();

      const j0=Math.max(0,Math.floor((L.cy-L.ay)/d)), j1=Math.min(N-1,Math.ceil((L.cy+L.ay)/d));
      for(let j=j0;j<=j1;j++){ const v=((j+0.5)*d-L.cy)/L.ay, v2=v*v; if(v2>=1)continue; const row=j*N;
        for(let i=i0;i<=i1;i++){ const u=((i+0.5)*d-L.cx)/L.ax, r2=u*u+v2;
          if(r2<1){ const t=h*Math.sqrt(1-r2); if(t>sg[row+i])sg[row+i]=t; } } } }
    if(gen!==GCgen)return null; }
  const barlB=[]; { let acc=0; for(const l of st.barl){acc+=+l.thickness_um; barlB.push([acc,l.material]);} }
  const gB=[]; { let acc=0; for(const l of g.stack){acc+=+l.height_um; gB.push([acc,l.material]);} }
  const zSi=+st.si.thickness_um, barlH=st.barl.reduce((a,l)=>a+ +l.thickness_um,0);
  GC={gen,N,d,span,names,siM,gD,cfT,cfI,sg,
      zSi, siName:st.si.material, barlB, barlTop:zSi+barlH, plTop:zSi+barlH+planarSpan(),
      gW:+g.width_um, ratio:Math.min(1,Math.max(0,+(g.top_ratio!=null?g.top_ratio:1)||0)),
      cw:gridCoat(), gH:gridStackH(), coatName:g.coat_material||"oxide", gB,
      mlName:st.ml.material, arlName:st.arl_top.material, arlT:+st.arl_top.thickness_um};
  return GC; }
// matAt 과 동일 결과, 캐시 조회 기반 (뷰 전용 고속 경로)
// fence 단면 확대 (벡터: 실제 nm 스케일 확대 표시)
function drawFenceZoom(cv){ if(!cv)return; const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const g=S.stack.grid, gw=+g.width_um, ratio=Math.min(1,Math.max(0,+(g.top_ratio!=null?g.top_ratio:1)||0));
  const cw=gridCoat(), gH=gridStackH(); if(gH<=0)return;
  const scX=(W*0.55)/(gw+2*cw), scZ=(H-30)/(gH+cw), cx=W/2, z0=H-18;
  const X=x=>cx+x*scX, Z=z=>z0-z*scZ;
  if(cw>0){ ctx.fillStyle=matColor(g.coat_material||"oxide"); ctx.beginPath();
    ctx.moveTo(X(-gw/2-cw),Z(0)); ctx.lineTo(X(gw/2+cw),Z(0)); ctx.lineTo(X(gw*ratio/2+cw),Z(gH+cw));
    ctx.lineTo(X(-gw*ratio/2-cw),Z(gH+cw)); ctx.closePath(); ctx.fill(); }
  let acc=0;
  for(const l of g.stack){ const z1=acc, z2=acc+ +l.height_um;
    const w1=gw*(1-(1-ratio)*z1/gH), w2=gw*(1-(1-ratio)*z2/gH);
    ctx.fillStyle=matColor(l.material); ctx.beginPath();
    ctx.moveTo(X(-w1/2),Z(z1)); ctx.lineTo(X(w1/2),Z(z1)); ctx.lineTo(X(w2/2),Z(z2)); ctx.lineTo(X(-w2/2),Z(z2)); ctx.closePath(); ctx.fill();
    acc=z2; }
  ctx.strokeStyle=css("--ink-faint"); ctx.strokeRect(0.5,0.5,W-1,H-1);
  ctx.fillStyle=css("--ink-faint"); ctx.font="10px "+css("--mono");
  ctx.fillText(`bottom ${(gw*1000).toFixed(0)}nm -> top ${(gw*ratio*1000).toFixed(0)}nm  (H=${(gH*1000).toFixed(0)}nm)`,8,12);
}
function matFast(x,y,zc,upto){ const g=GC; if(!g)return matAt(x,y,zc,upto);
  if(upto==null)upto=99;
  let i=(x/g.d)|0, j=(y/g.d)|0; i=i<0?0:(i>=g.N?g.N-1:i); j=j<0?0:(j>=g.N?g.N-1:j); const k=j*g.N+i;
  if(zc<g.zSi){ if(upto<1)return "air"; if(upto<2)return g.siName; return g.names[g.siM[k]]; }
  if(zc<g.barlTop){ if(upto<3)return "air"; const zz=zc-g.zSi;
    for(const e of g.barlB){ if(zz<=e[0])return e[1]; } return g.barlB.length?g.barlB[g.barlB.length-1][1]:"air"; }
  if(zc<g.plTop){ const zabs=zc-g.barlTop;
    if(upto>=4){ const wz=g.gH>0? g.gW*(1-(1-g.ratio)*Math.min(zabs/g.gH,1)) : g.gW; const d0=g.gD[k];
      if(zabs<=g.gH){ if(d0<wz/2){ for(const e of g.gB){ if(zabs<=e[0])return e[1]; } return g.gB.length?g.gB[g.gB.length-1][1]:"grid_metal"; }
        if(g.cw>0&&d0<wz/2+g.cw)return g.coatName; }
      else if(g.cw>0&&zabs<=g.gH+g.cw&&d0<wz/2+g.cw)return g.coatName; }
    if(upto>=5 && zabs<=g.cfT[k]) return g.names[g.cfI[k]];
    if(upto>=6) return g.mlName;
    return "air"; }
  if(upto<6)return "air";
  const surf=g.plTop+g.sg[k];
  if(zc<=surf)return g.mlName;
  if(upto>=7&&zc<=surf+g.arlT)return g.arlName;
  return "air"; }

// 고속 npy 빌더: 2D 맵 프리컴퓨트 -> prep(fillSlab) 반환 (전체/스트리밍 공용)
async function buildVoxPrep(){
  const p=P(),np=NP(),span=p*np,dxy=+S.grid.dxy_um,dz=+S.grid.dz_um,st=S.stack;
  const nx=Math.round(span/dxy),ny=nx,nz=Math.round(totalH()/dz);
  const names=["air"]; const idm={air:0}; const idOf=n=>{ if(!(n in idm)){idm[n]=names.length;names.push(n);} return idm[n]; };
  // ---- 2D 프리컴퓨트 ----
  const nP=nx*ny;
  // 주의: 거리/높이 맵은 Float64 — float32 면 경계값(예: d=0.01 vs wz/2=0.01)이
  // 반올림돼 Python 빌더(float64)와 경계 한 겹이 어긋남 (JS/Python npy 동치 요구)
  const siMap=new Uint8Array(nP), gD=new Float64Array(nP), cfTopM=new Float64Array(nP),
        cfIdM=new Uint8Array(nP), sagM=new Float64Array(nP);
  const g=st.grid, per=(g.pitch||1)*p, cfPer=((S.cf_array==="tetra")?2:1)*p;
  const W=+g.width_um, cw=gridCoat(), gH=gridStackH(),
        ratio=Math.min(1,Math.max(0,+(g.top_ratio!=null?g.top_ratio:1)||0));
  const th={R:+st.cf.R.thickness_um,G:+st.cf.G.thickness_um,B:+st.cf.B.thickness_um};
  const cvv={R:+(st.cf.R.curvature_um||0),G:+(st.cf.G.curvature_um||0),B:+(st.cf.B.curvature_um||0)};
  const cfIds={R:idOf(st.cf.R.material),G:idOf(st.cf.G.material),B:idOf(st.cf.B.material)};
  for(let yi=0;yi<ny;yi++){ const y=(yi+0.5)*dxy;
    for(let xi=0;xi<nx;xi++){ const x=(xi+0.5)*dxy, k=yi*nx+xi;
      const dm=dtiAt(x,y); siMap[k]=idOf(dm||st.si.material);
      gD[k]=Math.min(Math.abs(x-Math.round(x/per)*per), Math.abs(y-Math.round(y/per)*per));
      const pr=Math.min(np-1,Math.floor(y/p)), pc=Math.min(np-1,Math.floor(x/p)), col=S.bayer[pr][pc];
      const u=(x-(Math.floor(x/cfPer)+0.5)*cfPer)/(cfPer/2), v=(y-(Math.floor(y/cfPer)+0.5)*cfPer)/(cfPer/2);
      cfTopM[k]=Math.max(0.002, th[col]+cvv[col]*(2/3-(u*u+v*v)));
      cfIdM[k]=cfIds[col];
      sagM[k]=mlSag(x,y); } }
  // ---- z 밴드 ----
  const zSi=+st.si.thickness_um, barlH=st.barl.reduce((a,l)=>a+ +l.thickness_um,0);
  const barlB=[]; { let acc=0; for(const l of st.barl){acc+=+l.thickness_um; barlB.push([acc,idOf(l.material)]);} }
  const gB=[]; { let acc=0; for(const l of g.stack){acc+=+l.height_um; gB.push([acc,idOf(l.material)]);} }
  const coatId=cw>0?idOf(g.coat_material||"oxide"):0;
  const mlId=idOf(st.ml.material), arlId=idOf(st.arl_top.material), arlT=+st.arl_top.thickness_um;
  const barlTop=zSi+barlH, plSpan=planarSpan(), plTop=barlTop+plSpan;
  const fillSlab=(zi,out,off)=>{ const zc=(zi+0.5)*dz;
    if(zc<zSi){ out.set(siMap,off); }
    else if(zc<barlTop){ const zz=zc-zSi; let mid=barlB.length?barlB[barlB.length-1][1]:0;
      for(const [b_,i_] of barlB){ if(zz<=b_){mid=i_;break;} }
      out.fill(mid,off,off+nP); }
    else if(zc<plTop){ const zabs=zc-barlTop;
      const wz=gH>0? W*(1-(1-ratio)*Math.min(zabs/gH,1)) : W;
      let gid=0; if(zabs<=gH){ gid=gB.length?gB[gB.length-1][1]:0; for(const [b_,i_] of gB){ if(zabs<=b_){gid=i_;break;} } }
      const inG=zabs<=gH, inCap=cw>0&&zabs<=gH+cw;
      for(let k=0;k<nP;k++){ let m=mlId;
        if(zabs<=cfTopM[k]) m=cfIdM[k];
        const d=gD[k];
        if(inG){ if(d<wz/2)m=gid; else if(cw>0&&d<wz/2+cw)m=coatId; }
        else if(inCap && d<wz/2+cw) m=coatId;
        out[off+k]=m; } }
    else { for(let k=0;k<nP;k++){ const surf=plTop+sagM[k]; let m=0;
        if(zc<=surf)m=mlId; else if(zc<=surf+arlT)m=arlId;
        out[off+k]=m; } } };
  return {nx,ny,nz,nP,names,dxy,dz,fillSlab};
}
// 전체 배열 생성 (<=4GB)
async function buildVoxels(onProg){ const P0=await buildVoxPrep();
  const {nx,ny,nz,nP,names,dxy,dz,fillSlab}=P0;
  const data=new Uint8Array(nz*nP);
  for(let zi=0;zi<nz;zi++){ fillSlab(zi,data,zi*nP);
    if(onProg&&(zi&15)===0){ onProg(zi/nz); await new Promise(r=>setTimeout(r,0)); } }

  function drawWall(wd){ const [img,s0,sw,TL,TR,BL]=wd;
    const a=pr(...TL), b2=pr(...TR), c2=pr(...BL);
    const iw=img.width*sw, ih=img.height;
    ctx.save();
    ctx.transform((b2[0]-a[0])/iw,(b2[1]-a[1])/iw,(c2[0]-a[0])/ih,(c2[1]-a[1])/ih,a[0],a[1]);
    ctx.drawImage(img, img.width*s0,0,iw,ih, 0,0,iw,ih); ctx.restore(); }
  const far=wallDefs.filter(w=>ndep(...w[6])>=0), near=wallDefs.filter(w=>ndep(...w[6])<0);
  far.forEach(drawWall); near.forEach(drawWall);
  // 상단 표면 메쉬 (far -> near), 법선 음영 -> 곡면 부드럽게
  const Lx=0.42,Ly=0.26,Lz=0.87;
  const cells=[], THR=0.15;
  const Hat=(jj,ii)=>{ if(ii<0||jj<0||ii>=N||jj>=N)return null; const c=Cf[jj*N+ii]; return c==null?null:Hf[jj*N+ii]; };
  const Cat=(jj,ii)=>{ if(ii<0||jj<0||ii>=N||jj>=N)return null; return Cf[jj*N+ii]; };
  // 스텝 판정: 단차 크고 '표면 물질이 다를 때'만 (같은 물질 급경사=곡면 -> 부드럽게 보간)
  const isStep=(h0,c0,hn,cn)=> hn==null || (Math.abs(hn-h0)>THR && cn!==c0) || Math.abs(hn-h0)>0.6;
  for(let j=0;j<N-1;j++)for(let i=0;i<N-1;i++){ const c=Cf[j*N+i]; if(!c)continue;
    const h00=Hf[j*N+i];
    let h10=Hat(j,i+1),h01=Hat(j+1,i),h11=Hat(j+1,i+1);
    const disc=isStep(h00,c,h10,Cat(j,i+1))||isStep(h00,c,h01,Cat(j+1,i))||isStep(h00,c,h11,Cat(j+1,i+1));
    if(disc){ h10=h00; h01=h00; h11=h00; }                    // 스텝: 평탄 타일
    const x0=(i+0.5)*dxy,y0=(j+0.5)*dxy,x1=x0+dxy,y1=y0+dxy;
    const P0=pr(x0,y0,h00),P1=pr(x1,y0,h10),P2=pr(x1,y1,h11),P3=pr(x0,y1,h01);
    let nx=-((h10??h00)-h00)/dxy, ny=-((h01??h00)-h00)/dxy, nz=1;
    const nl=Math.hypot(nx,ny,nz); nx/=nl;ny/=nl;nz/=nl;
    const br=Math.max(-0.4,Math.min(0.4,(nx*Lx+ny*Ly+nz*Lz-0.82)*1.6));
    cells.push({P0,P1,P2,P3,col:matColor(c),br,depth:(P0[2]+P2[2])/2});
    // 수직 스커트 (오른쪽/위쪽 이웃과의 스텝)
    const nb=[[j,i+1,[x1,y0],[x1,y1]],[j+1,i,[x0,y1],[x1,y1]]];
    for(const [jj,ii,A,B] of nb){ const hn=Hat(jj,ii); if(hn==null)continue;
      if(isStep(h00,c,hn,Cat(jj,ii))){ const zt=Math.max(h00,hn), zb=Math.min(h00,hn);
        const colN=(hn>h00)?Cf[jj*N+ii]:c;
        const Q0=pr(A[0],A[1],zb),Q1=pr(B[0],B[1],zb),Q2=pr(B[0],B[1],zt),Q3=pr(A[0],A[1],zt);
        cells.push({P0:Q0,P1:Q1,P2:Q2,P3:Q3,col:matColor(colN),br:-0.42,depth:(Q0[2]+Q2[2])/2}); } } }
  cells.sort((a,b)=>b.depth-a.depth);
  for(const q2 of cells){ ctx.beginPath(); ctx.moveTo(q2.P0[0],q2.P0[1]); ctx.lineTo(q2.P1[0],q2.P1[1]); ctx.lineTo(q2.P2[0],q2.P2[1]); ctx.lineTo(q2.P3[0],q2.P3[1]); ctx.closePath();
    const col=shadeHex(q2.col,Math.round(q2.br*80)); ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineWidth=0.8; ctx.fill(); ctx.stroke(); }
  ctx.fillStyle=css("--ink-faint"); ctx.font="11px "+css("--mono"); ctx.fillText("3D · drag=rotate · wheel=zoom",12,18);
}

let mlDrag=null;
function _mlScale(cv){ const span=P()*NP(),pad=10; const sc=(cv.width-2*pad)/span; return {sc,pad,span}; }
function _mlSagOf(L,x,y){ const u=(x-L.cx)/L.ax,v=(y-L.cy)/L.ay,r2=u*u+v*v;
  return r2<1? mlH(L)*Math.sqrt(1-r2) : 0; }
function drawMLedit(){ const cv=el("mlEdit"); if(!cv)return; const ctx=cv.getContext("2d"); const {sc,pad,span}=_mlScale(cv);
  const X=x=>pad+x*sc, Y=y=>cv.height-pad-y*sc;
  ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle=css("--panel"); ctx.fillRect(0,0,cv.width,cv.height);
  const Ls=mlLenses(), hr=mlHR(), hmax=Math.max(mlMaxH(),1e-9);
  // 1) sag heatmap + 승자(id) 맵
  const M=110, idm=new Int16Array(M*M);
  for(let j=0;j<M;j++)for(let i=0;i<M;i++){ const x=span*(i+.5)/M,y=span*(j+.5)/M;
    let best=0,bi=-1; for(let k=0;k<Ls.length;k++){ const s=_mlSagOf(Ls[k],x,y); if(s>best){best=s;bi=k;} }
    idm[j*M+i]=bi;
    if(best>0){ ctx.fillStyle=`rgba(242,193,78,${0.10+0.85*best/hmax})`;
      ctx.fillRect(X(span*i/M),Y(span*(j+1)/M),span/M*sc+1,span/M*sc+1); } }
  // 2) 접촉선(찌부): 승자 id 가 바뀌는 경계
  ctx.fillStyle=css("--accent");
  for(let j=0;j<M-1;j++)for(let i=0;i<M-1;i++){ const a=idm[j*M+i]; if(a<0)continue;
    const r=idm[j*M+i+1], d=idm[(j+1)*M+i];
    if((r>=0&&r!==a)||(d>=0&&d!==a)) ctx.fillRect(X(span*i/M),Y(span*(j+1)/M),1.6,1.6); }
  // 3) pixel grid
  ctx.strokeStyle=css("--line"); ctx.lineWidth=1; const p=P();
  for(let t=0;t<=span+1e-6;t+=p){ ctx.beginPath();ctx.moveTo(X(t),Y(0));ctx.lineTo(X(t),Y(span));ctx.stroke(); ctx.beginPath();ctx.moveTo(X(0),Y(t));ctx.lineTo(X(span),Y(t));ctx.stroke(); }
  // 4) 윤곽선: 이웃 풍선에 먹힌 구간은 제외(찌부된 자유호만) -> 겹쳐 보이지 않음
  Ls.forEach((L,li)=>{ ctx.strokeStyle=css("--accent"); ctx.lineWidth=(mlDrag&&mlDrag.i===li)?2.4:1.4;
    ctx.beginPath(); let pen=false; const NA=180;
    for(let a=0;a<=NA;a++){ const t=2*Math.PI*a/NA, bx=L.cx+L.ax*Math.cos(t), by=L.cy+L.ay*Math.sin(t);
      let cov=false; for(let k=0;k<Ls.length;k++){ if(k===li)continue; if(_mlSagOf(Ls[k],bx,by)>1e-9){cov=true;break;} }
      if(cov){ pen=false; continue; }
      if(!pen){ ctx.moveTo(X(bx),Y(by)); pen=true; } else ctx.lineTo(X(bx),Y(by)); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(X(L.cx),Y(L.cy),3,0,2*Math.PI); ctx.fillStyle=css("--accent"); ctx.fill(); });
  const info=el("mlInfo"); if(info) info.textContent=`${Ls.length} lenses · h/r=${hr.toFixed(2)} · max h=${mlMaxH().toFixed(3)}µm`;
}
function wireMLedit(){ const cv=el("mlEdit"); if(!cv||cv._wired)return; cv._wired=true;
  const um=ev=>{ const r=cv.getBoundingClientRect(); const {sc,pad,span}=_mlScale(cv);
    return [ (ev.clientX-r.left-pad)/sc, span-(ev.clientY-r.top-pad)/sc ]; };
  const matz=()=>{ if(!S.stack.ml.lenses||!S.stack.ml.lenses.length) S.stack.ml.lenses=mlTemplateLenses().map(L=>({...L})); };
  cv.addEventListener("pointerdown",ev=>{ const [x,y]=um(ev); const Ls=mlLenses(); const p=P();
    for(let i=Ls.length-1;i>=0;i--){ const L=Ls[i]; const u=(x-L.cx)/L.ax,v=(y-L.cy)/L.ay,r=Math.hypot(u,v);
      if(r<1&&Math.abs(r-1)*Math.min(L.ax,L.ay)<0.07*p){ matz(); mlDrag={i,mode:"size"}; break; }   // 가장자리 얇은 밴드=크기
      if(r<1){ matz(); mlDrag={i,mode:"move",dx:x-L.cx,dy:y-L.cy}; break; } }                        // 내부 어디든=이동
    if(mlDrag)cv.setPointerCapture(ev.pointerId); });
  cv.addEventListener("pointermove",ev=>{ if(!mlDrag)return; const [x,y]=um(ev); const L=S.stack.ml.lenses[mlDrag.i]; const p=P();
    if(mlDrag.mode==="move"){ L.cx=x-mlDrag.dx; L.cy=y-mlDrag.dy; }
    else { const dx=Math.abs(x-L.cx),dy=Math.abs(y-L.cy);
      if(dx>dy) L.ax=Math.min(2.2*p,Math.max(0.12*p,dx)); else L.ay=Math.min(2.2*p,Math.max(0.12*p,dy)); }
    drawMLedit(); save(); });                                    // 드래그 중: 2D 찌부만 실시간
  cv.addEventListener("pointerup",()=>{ mlDrag=null; drawMLedit(); renderViews(); save(); });  // 놓으면 3D 반영
}

// 간단 YAML emit (구조 저장용)
function toYAML(o,ind){ ind=ind||0; const pad="  ".repeat(ind); let s="";
  if(Array.isArray(o)){ for(const it of o) s+=pad+"- "+flow(it)+"\n"; return s; }
  for(const k in o){ const v=o[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&!flat(v)) s+=pad+k+":\n"+toYAML(v,ind+1);
    else if(Array.isArray(v)&&v.some(x=>x&&typeof x==="object")) s+=pad+k+":\n"+toYAML(v,ind+1); else s+=pad+k+": "+flow(v)+"\n"; } return s; }
function flat(o){ return !Array.isArray(o)&&Object.values(o).every(v=>typeof v!=="object"||v===null); }
function flow(v){ if(v==null)return""; if(Array.isArray(v))return "["+v.map(flow).join(", ")+"]"; if(typeof v==="object")return "{ "+Object.entries(v).map(([k,x])=>k+": "+flow(x)).join(", ")+" }"; if(typeof v==="string")return /[:#\[\]{}",]/.test(v)?JSON.stringify(v):v; return String(v); }
// 간단 YAML parser (구조 import)
function parseYAML(text){ const lines=text.replace(/\t/g,"  ").split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim()!==""&&!/^\s*#/.test(l)); let i=0;
  const peek=()=> i<lines.length?lines[i].match(/^ */)[0].length:-1;
  function block(ind){ if(i<lines.length&&lines[i].slice(ind).startsWith("- "))return list(ind); const o={};
    while(i<lines.length){ const cur=lines[i],ci=cur.match(/^ */)[0].length; if(ci<ind)break; if(ci>ind){i++;continue;}
      const m=cur.slice(ind).match(/^([^:]+):(.*)$/); if(!m){i++;continue;} const key=m[1].trim(),rest=m[2].trim(); i++;
      if(rest===""){ const ci2=peek(); o[key]=(ci2>ind||(i<lines.length&&lines[i].slice(ci2).startsWith("- ")&&ci2>=ind))?block(ci2>ind?ci2:ind+2):null; }
      else o[key]=pf(rest); } return o; }
  function list(ind){ const a=[]; while(i<lines.length){ const cur=lines[i],ci=cur.match(/^ */)[0].length; if(ci<ind||!cur.slice(ind).startsWith("- "))break; const rest=cur.slice(ind+2).trim(); i++; if(rest==="")a.push(block(peek())); else a.push(pf(rest)); } return a; }
  return block(peek());
  function pf(s){ s=s.trim(); if(s[0]==="["||s[0]==="{")return flowP(s); return sc(s); }
  function flowP(s){ let j=0; function ws(){while(j<s.length&&/\s/.test(s[j]))j++;} function val(){ ws();
    if(s[j]==="["){j++;const a=[];ws();if(s[j]==="]"){j++;return a;} while(true){a.push(val());ws();if(s[j]===","){j++;continue;}if(s[j]==="]"){j++;break;}break;}return a;}
    if(s[j]==="{"){j++;const o={};ws();if(s[j]==="}"){j++;return o;} while(true){ws();let k="";while(j<s.length&&s[j]!==":"){k+=s[j++];}j++;o[k.trim()]=val();ws();if(s[j]===","){j++;continue;}if(s[j]==="}"){j++;break;}break;}return o;}
    if(s[j]==='"'){let k=j+1,str="";while(k<s.length&&s[k]!=='"'){str+=s[k++];}j=k+1;return str;} let t="";while(j<s.length&&!/[,\]}]/.test(s[j])){t+=s[j++];} return sc(t.trim()); } return val(); }
  function sc(s){ if(s===""||s==null)return null; if(s[0]==='"'&&s[s.length-1]==='"')return JSON.parse(s); if(s==="true")return true; if(s==="false")return false; if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s))return parseFloat(s); return s; } }
function loadStruct(obj){ S=Object.assign(structuredClone(DEFAULT),obj); if(obj.stack)S.stack=Object.assign(structuredClone(DEFAULT.stack),obj.stack); if(obj.materials)S.materials=Object.assign(structuredClone(DEFAULT.materials),obj.materials);
  // yaml 에 동봉된 dispersion(λ-테이블) 복원 -> 새 브라우저에서도 물질 테이블 유지
  if(obj.dispersion){ for(const nm in obj.dispersion){ const t=obj.dispersion[nm]; if(Array.isArray(t)&&t.length>1){ folderLib[nm]=t; if(!(nm in S.materials)){ const L=t.map(r=>r[0]); S.materials[nm]={n:+interp1(refLambda,L,t.map(r=>r[1])).toFixed(4),k:+interp1(refLambda,L,t.map(r=>r[2])).toFixed(4)}; assignMatColor(nm); } } } }
  clampRes(); save(); prod.value=S.product||""; curStep=0; renderStep(); }

  else{ g.style.display="block"; el("qeRun").disabled=true;
    g.textContent="RCWA 서버가 꺼져 있습니다. 터미널에서 아래 한 줄을 실행하면 이 화면이 서버 모드로 열립니다:\n\n"+
      "  cd cis_rcwa && python3 app.py\n\n(pip install torch numpy pyyaml · GPU 있으면 자동 사용 · 그 뒤 이 버튼을 다시 누르세요)";
    el("qeNote").textContent="서버 미연결"; } };
el("qeClose").onclick=()=>{ qeDlg.close(); };
el("qeStop").onclick=async()=>{ if(QE.job) try{ await fetch(qeApiBase()+"/api/qe/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job:QE.job})}); }catch(e){} };
el("qeRun").onclick=async()=>{ if(QE.running)return;
  const body={ yaml:structYAML(), lam0:+el("qeL0").value, lam1:+el("qeL1").value,
    n:+el("qeN").value, nG:+el("qeNG").value, downsample:+el("qeDS").value, theta:+el("qeTH").value };
  let r; try{ r=await(await fetch(qeApiBase()+"/api/qe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }
  catch(e){ el("qeNote").textContent="요청 실패: "+e.message; return; }
  if(!r.job){ el("qeNote").textContent="오류: "+(r.error||"?"); return; }
  QE.job=r.job; QE.rows=[]; QE.running=true;
  el("qeRun").disabled=true; el("qeStop").disabled=false; el("qeCsv").disabled=true;
  QE.timer=setInterval(qePoll,700); };
async function qePoll(){ let s; try{ s=await(await fetch(qeApiBase()+"/api/qe/status?job="+QE.job)).json(); }catch(e){ return; }
  QE.rows=s.rows||QE.rows;
  el("qeProg").style.width=Math.round((s.progress||0)*100)+"%";
  el("qeNote").textContent=(s.state==="running"?"":"["+s.state+"] ")+(s.error||s.note||"");
  drawQEChart(); qeTableFill();
  if(s.state!=="running"){ clearInterval(QE.timer); QE.running=false;
    el("qeRun").disabled=false; el("qeStop").disabled=true; el("qeCsv").disabled=QE.rows.length===0; } }
el("qeCsv").onclick=()=>{ const rgb=QE.rows.length&&QE.rows[0].length>=7;
  let t="lambda_um,R,QE_Si_total,A_stack"+(rgb?",QE_R,QE_G,QE_B":"")+"\n"+QE.rows.map(r=>r.join(",")).join("\n");
  download(pname()+"_qe_spectrum.csv",t,"text/csv"); };
function qeTableFill(){ const d=el("qeTable"); if(!QE.rows.length){d.textContent="";return;}
  const rgb=QE.rows[0].length>=7;
  d.innerHTML="<table><tr><th>λ(nm)</th>"+(rgb?"<th>QE_R</th><th>QE_G</th><th>QE_B</th>":"")+
    "<th>QE전체</th><th>R</th><th>A_stack</th><th>합</th></tr>"+
    QE.rows.map(r=>`<tr><td>${(r[0]*1000).toFixed(0)}</td>`+
      (rgb?`<td>${r[4].toFixed(3)}</td><td>${r[5].toFixed(3)}</td><td>${r[6].toFixed(3)}</td>`:"")+
      `<td>${r[2].toFixed(3)}</td><td>${r[1].toFixed(3)}</td><td>${r[3].toFixed(3)}</td><td>${(r[1]+r[2]+r[3]).toFixed(3)}</td></tr>`).join("")+"</table>";
  d.querySelectorAll("td,th").forEach(c=>{c.style.padding="1px 12px";c.style.textAlign="right";}); }
// ---- 스펙트럼 차트: 3 시리즈(QE/R/A) + 합(=1) 점검선, 직접 라벨 + 범례 + hover 툴팁
function drawQEChart(hoverI){ const cv=el("qeChart"); if(!cv)return; const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height, mL=52,mR=86,mT=16,mB=34, pw=W-mL-mR, ph=H-mT-mB;
  const C=qeColors(), ink=css("--ink"), dim=css("--ink-dim"), faint=css("--ink-faint"), line=css("--line");
  ctx.clearRect(0,0,W,H);
  const rows=QE.rows;
  const l0=rows.length? rows[0][0] : +el("qeL0").value, l1=rows.length? rows[rows.length-1][0] : +el("qeL1").value;
  const X=lam=>mL+(l1>l0?(lam-l0)/(l1-l0):0.5)*pw, Y=v=>mT+(1.02-Math.min(1.02,Math.max(0,v)))/1.02*ph;
  // 축/그리드 (recessive)
  ctx.strokeStyle=line; ctx.fillStyle=faint; ctx.font="10px "+css("--mono"); ctx.lineWidth=1;
  for(let v=0;v<=1.001;v+=0.25){ const y=Y(v)+0.5; ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(W-mR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText(v.toFixed(2),mL-6,y+3); }
  const nt=5; for(let i=0;i<=nt;i++){ const lam=l0+(l1-l0)*i/nt, x=X(lam);
    ctx.textAlign="center"; ctx.fillText((lam*1000).toFixed(0),x,H-mB+16); }
  ctx.fillStyle=dim; ctx.textAlign="center"; ctx.fillText("wavelength (nm)",mL+pw/2,H-6);
  ctx.save(); ctx.translate(12,mT+ph/2); ctx.rotate(-Math.PI/2); ctx.fillText("fraction",0,0); ctx.restore();
  if(!rows.length){ ctx.fillStyle=faint; ctx.textAlign="center"; ctx.font="12px "+css("--mono");
    ctx.fillText("Run 을 누르면 R/G/B 컬러별 QE 스펙트럼이 여기 그려집니다",mL+pw/2,mT+ph/2); qeLegendFill(C,false); return; }
  const hasRGB=rows[0].length>=7;
  // 보조 시리즈 (중립 잉크, 파선/얇은 선 = 색 아닌 2차 인코딩)
  ctx.strokeStyle=faint; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.beginPath();
  rows.forEach((r,i)=>{ const x=X(r[0]),y=Y(r[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.setLineDash([]);   // Reflection
  if(hasRGB){ ctx.strokeStyle=dim; ctx.lineWidth=1.2; ctx.beginPath();
    rows.forEach((r,i)=>{ const x=X(r[0]),y=Y(r[2]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); }               // QE total(thin)
  // 주 시리즈: 컬러별 QE (CF 하부 Si 창) — 없으면 구형(QE/R/A) 표시
  const S3=hasRGB? [["QE_R",4,C.R,"QE R"],["QE_G",5,C.QE,"QE G"],["QE_B",6,C.A,"QE B"]]
                 : [["QE",2,C.QE,"QE (Si)"],["R",1,C.R,"Reflection"],["A",3,C.A,"Stack abs."]];
  for(const [nm,ci,col,lb] of S3){ ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
    rows.forEach((r,i)=>{ const x=X(r[0]),y=Y(r[ci]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    ctx.fillStyle=col; rows.forEach(r=>{ ctx.beginPath(); ctx.arc(X(r[0]),Y(r[ci]),3.5,0,7); ctx.fill();
      ctx.strokeStyle=css("--panel"); ctx.lineWidth=1.5; ctx.stroke(); });
    // 직접 라벨 (선 끝, 잉크 텍스트 + 색 칩)
    const last=rows[rows.length-1], y=Y(last[ci]);
    ctx.fillStyle=col; ctx.fillRect(W-mR+8,y-4,8,8);
    ctx.fillStyle=ink; ctx.textAlign="left"; ctx.font="11px "+css("--mono");
    ctx.fillText(lb,W-mR+20,y+4); }
  if(hoverI!=null&&rows[hoverI]){ const r=rows[hoverI],x=X(r[0])+0.5;
    ctx.strokeStyle=dim; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,mT); ctx.lineTo(x,H-mB); ctx.stroke(); ctx.setLineDash([]); }
  qeLegendFill(C,hasRGB); }
function qeLegendFill(C,hasRGB){ const items=hasRGB
  ? [["QE R (red 픽셀 Si)",C.R],["QE G (green 픽셀 Si)",C.QE],["QE B (blue 픽셀 Si)",C.A],["QE 전체 (얇은 선)",css("--ink-dim")],["Reflection (파선)",css("--ink-faint")]]
  : [["QE (Si 로 결합)",C.QE],["Reflection",C.R],["Stack absorption",C.A]];
  el("qeLegend").innerHTML=items
  .map(([t,c])=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></span>${t}</span>`).join(""); }
el("qeChart").addEventListener("mousemove",e=>{ if(!QE.rows.length)return; const cv=el("qeChart"),rc=cv.getBoundingClientRect();
  const px=(e.clientX-rc.left)*cv.width/rc.width, mL=52,mR=86,pw=cv.width-mL-mR;
  const l0=QE.rows[0][0], l1=QE.rows[QE.rows.length-1][0];
  let bi=0,bd=1e9; QE.rows.forEach((r,i)=>{ const x=mL+(l1>l0?(r[0]-l0)/(l1-l0):0.5)*pw, d=Math.abs(x-px); if(d<bd){bd=d;bi=i;} });
  drawQEChart(bi); const r=QE.rows[bi],tip=el("qeTip");
  tip.style.display="block"; tip.style.left=Math.min(rc.width-180,(e.clientX-rc.left)+12)+"px"; tip.style.top="12px";
  tip.innerHTML=`λ ${(r[0]*1000).toFixed(0)} nm<br>`+
    (r.length>=7?`QE R ${r[4].toFixed(3)} · G ${r[5].toFixed(3)} · B ${r[6].toFixed(3)}<br>`:"")+
    `QE전체 ${r[2].toFixed(3)} · R(반사) ${r[1].toFixed(3)}<br>A ${r[3].toFixed(3)} · 합 ${(r[1]+r[2]+r[3]).toFixed(3)}`; });
el("qeChart").addEventListener("mouseleave",()=>{ el("qeTip").style.display="none"; drawQEChart(); });

// ============================ init ============================
renderStep();
</script>
