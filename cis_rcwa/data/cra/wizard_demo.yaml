# 제품 CRA 스펙 — 파일명 = 제품명 (위저드 상단 제품명과 일치하면 자동 연결)
# module_cra: 빛의 실제 입사각(θ,φ),  sensor_cra: ML/CF shift 크기 산출용
# sensor_cra 가 module 과 같으면 아래처럼 앵커(*module_cra) 재사용
project_id: "wizard_demo"

spec:
  module_cra: &module_cra
    columns: [ field, image_height_um, cra_deg ]
    data:
      - [ 0.0, 0.000, 0.0 ]
      - [ 0.1, 0.328, 3.1 ]
      - [ 0.2, 0.655, 6.2 ]
      - [ 0.3, 0.983, 9.2 ]
      - [ 0.4, 1.311, 12.1 ]
      - [ 0.5, 1.639, 14.9 ]
      - [ 0.6, 1.966, 17.6 ]
      - [ 0.7, 2.294, 20.1 ]
      - [ 0.8, 2.622, 22.4 ]
      - [ 0.9, 2.949, 24.4 ]
      - [ 1.0, 3.277, 26.0 ]
  sensor_cra: *module_cra          # 다르면 별도 표로 교체
  cra_interpolation_method: linear # (poly6th 지정해도 선형 사용)
  ml_shrink_ratio: 0.0150e-6       # [m/deg] -> ML shift = ratio x CRA
  cf_shrink_ratio: 0.0068e-6       # [m/deg] -> CF+grid shift
  f_number: 2.0
