# hybrid lens — 정합 검증용 구성 (역산값 4개 포함)  ※ 예측용 아님
#
# 실측 QE 로 되돌려 넣은 값(cf_green 소자 소광 / coverage 0.25 / ILD n_eff 1.75 /
# bandwidth 20)이 들어 있다. 실측 28점 2.30%p 재현용이며, 신제품 예측이나
# DOE/surrogate 의 기본으로 쓰면 안 된다 — 기본은 conf/hybrid_lens.yaml.
# 각 값의 정체와 교체(졸업) 조건: docs/최종구성_v131.md, docs/새제품_적용_가이드.md
product: hybrid_lens
ambient: air
grid:
  pixel_pitch_um: 0.7
  n_pixels: 4
  dxy_um: 0.01
  dz_um: 0.01
  air_margin_um: 0.2
cf_array: tetra
bayer:
- - R
  - R
  - G
  - G
- - R
  - R
  - G
  - G
- - G
  - G
  - B
  - B
- - G
  - G
  - B
  - B
materials:
  air: {}
  si: {}
  sio2: {}
  poly: {}
  al2o3: {}
  tio2: {}
  peox: {}
  hfox: {}
  tin: {}
  ti: {}
  teos: {}
  cf_red: {}
  # 소자 유효 n,k — 통과대역 소광을 실측 QE 로 역산 (적분구 측정 시 그 값으로 교체).
  # 근거/경위: docs/Green원인분석_쿠폰측정.md, 파일 헤더 참조.
  cf_green: {src: cf_green_device}
  cf_blue: {}
  ml: {}
  ml_arl: {}
  # BRL spacer 유효매질 — ILD 는 순수 SiO2 가 아니라 질화막(식각정지층) 포함.
  # n_eff 1.46/1.60/1.75/1.90 비교에서 1.75 가 R 장파장 최적 + 혼합비로 타당.
  ild_eff: {n: 1.75, k: 0.0}
stack:
  si:
    material: si
    thickness_um: 3.85
    back_reflector:
      enabled: true
      coverage: 0.25
      material: cu
      thickness_um: 0.15
      spacer_um: 0.24
      spacer_material: ild_eff
  dti:
    mode: 2x2_open
    center_open: true
    width_um: 0.09
    oxide_liner_um: 0.02
    liner: sio2
    fill: poly
    center_gap_x_um: 0.26
    center_gap_y_um: 0.26
  barl:
  - material: al2o3
    thickness_um: 0.01
  - material: tio2
    thickness_um: 0.036
  - material: peox
    thickness_um: 0.015
  - material: hfox
    thickness_um: 0.01
  - material: al2o3
    thickness_um: 0.01
  grid:
    pitch: 2
    width_um: 0.11
    top_ratio: 0.7
    coat_on: true
    coat_material: al2o3
    coat_um: 0.01
    deadzone_um: 0.1
    stack:
    - material: tin
      height_um: 0.006
    - material: ti
      height_um: 0.054
    - material: teos
      height_um: 0.33
  cf:
    R:
      material: cf_red
      thickness_um: 0.5
      curvature_um: 0
      scale_x: 0.92
      scale_y: 0.92
      chamfer_um: 0.05
      chamfer_angle: 45
    G:
      material: cf_green
      thickness_um: 0.52
      curvature_um: 0
      scale_x: 0.95
      scale_y: 0.95
      chamfer_um: 0.05
      chamfer_angle: 45
    B:
      material: cf_blue
      thickness_um: 0.475
      curvature_um: 0
      scale_x: 0.9
      scale_y: 0.9
      chamfer_um: 0.05
      chamfer_angle: 45
  ml:
    material: ml
    planar_um: 0.2
    hr: 0.55
    height_um: 0.36
    sag_height_um: 0.55
    quads:
    - - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
      - shape: 1x1
        scale: 1.14
        height_um: 0.38
    - - shape: 1x1
        scale: 1.14
        height_um: 0.38
      - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
  arl_top:
    material: ml_arl
    thickness_um: 0.09
measurement:
  bandwidth_nm: 20
  n_sub: 3
