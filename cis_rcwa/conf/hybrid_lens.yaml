# hybrid lens 제품 구조 — 순수 예측 구성 (역산값 0개)
#
# 입력은 표준 파이프라인 그대로: 구조 스펙 + 6000A thin-film 실측 n,k.
# QE 를 보고 되돌려 넣은 값이 없다. 예측/DOE/surrogate 는 이 파일을 쓸 것.
#
# [입력값 출처]
#   물질 n,k        : 전부 제품 실측 (data/materials/*.txt, 6000A 평막)
#   BRL             : Cu(확인) / 1500A(확인) / spacer 2400A(확인) / ild_eff n=1.75(추정)
#   coverage 0.2    : 사용자 추정치 ("통짜는 아니고 0.2 정도") — GDS 면적비로 교체 요망
#   bandwidth 20nm  : 측정기 반치폭 추정 — 장비 사양서로 교체 요망 (소자 모델 아님,
#                     측정기 모델. 실측과 비교할 때만 작용)
#
# [이 구성의 정직한 예측 오차 — nG=101, ds=1, 실측 28점]
#   전체 2.78%p (ds2 기준). G peak 78.9 (실측 74.3, +4.6).
#   +4.4 의 원인은 소거·코드감사로 '평막 n,k 가 못 담는 통과대역 소광' 으로
#   특정됨 (docs/Green원인분석_쿠폰측정.md). 적분구 측정이 오면 입력이 좋아져서
#   (피팅 없이) 정확도가 올라간다.
#
# [정합 검증용 구성은 conf/hybrid_lens_calibrated.yaml — 예측에 쓰지 말 것]
product: hybrid_lens
ambient: air
grid:
  pixel_pitch_um: 0.7
  n_pixels: 4
  dxy_um: 0.01
  dz_um: 0.01
  air_margin_um: 0.2
cf_array: tetra
bayer:
- - R
  - R
  - G
  - G
- - R
  - R
  - G
  - G
- - G
  - G
  - B
  - B
- - G
  - G
  - B
  - B
materials:
  air: {}
  si: {}
  sio2: {}
  poly: {}
  al2o3: {}
  tio2: {}
  peox: {}
  hfox: {}
  tin: {}
  ti: {}
  teos: {}
  cf_red: {}
  cf_green: {}
  cf_blue: {}
  ml: {}
  ml_arl: {}
  # BRL spacer 유효매질 — ILD 는 SiO2+SiN(식각정지층) 혼합. n_eff 1.46~1.90
  # 스캔에서 1.75 가 R 장파장 최적 (전체 2.86 -> 2.78). 실제 필름스택으로 교체 요망.
  ild_eff: {n: 1.75, k: 0.0}
stack:
  si:
    material: si
    thickness_um: 3.85
    back_reflector:
      enabled: true
      coverage: 0.2
      material: cu
      thickness_um: 0.15
      spacer_um: 0.24
      spacer_material: ild_eff
  dti:
    mode: 2x2_open
    center_open: true
    width_um: 0.09
    oxide_liner_um: 0.02
    liner: sio2
    fill: poly
    center_gap_x_um: 0.26
    center_gap_y_um: 0.26
  barl:
  - material: al2o3
    thickness_um: 0.01
  - material: tio2
    thickness_um: 0.036
  - material: peox
    thickness_um: 0.015
  - material: hfox
    thickness_um: 0.01
  - material: al2o3
    thickness_um: 0.01
  grid:
    pitch: 2
    width_um: 0.11
    top_ratio: 0.7
    coat_on: true
    coat_material: al2o3
    coat_um: 0.01
    deadzone_um: 0.1
    stack:
    - material: tin
      height_um: 0.006
    - material: ti
      height_um: 0.054
    - material: teos
      height_um: 0.33
  cf:
    R:
      material: cf_red
      thickness_um: 0.5
      curvature_um: 0
      scale_x: 0.92
      scale_y: 0.92
      chamfer_um: 0.05
      chamfer_angle: 45
    G:
      material: cf_green
      thickness_um: 0.52
      curvature_um: 0
      scale_x: 0.95
      scale_y: 0.95
      chamfer_um: 0.05
      chamfer_angle: 45
    B:
      material: cf_blue
      thickness_um: 0.475
      curvature_um: 0
      scale_x: 0.9
      scale_y: 0.9
      chamfer_um: 0.05
      chamfer_angle: 45
  ml:
    material: ml
    planar_um: 0.2
    hr: 0.55
    height_um: 0.36
    sag_height_um: 0.55
    quads:
    - - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
      - shape: 1x1
        scale: 1.14
        height_um: 0.38
    - - shape: 1x1
        scale: 1.14
        height_um: 0.38
      - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
  arl_top:
    material: ml_arl
    thickness_um: 0.09
measurement:
  bandwidth_nm: 20
  n_sub: 3
