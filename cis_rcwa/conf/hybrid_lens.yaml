# hybrid lens 제품 구조 — 실측 QE 정합본
#
# 물질 n,k 는 전부 제품 실측값 (data/materials/*.txt).
#
# [실측으로 정한 값 — 실제 스펙 확인되면 교체할 것]
#   back_reflector.coverage 0.25  : M1 면적비 — 역산값. 실제 레이아웃으로 교체 요망.
#   spacer_material ild_eff n=1.75: ILD 유효굴절률 — 역산값(1.46~1.90 비교 최적).
#                                   실제 ILD 스택(산화/질화 두께비)으로 교체 요망.
#   materials.cf_green.src        : 소자 유효 소광 — 역산값. 적분구 측정으로 교체 요망.
#   back_reflector.spacer_um 0.24 : Si 표면 ~ M1 바닥 = 2400A (확인됨).
#                                   그중 gate oxide 가 1300A. 역산값 아님.
#   measurement.bandwidth_nm      : QE 측정기 반치폭. 기기 스펙 — 확인 요망.
#   * 확인된 값: 금속=Cu, 두께=1500A(0.15µm), 유전체=ILD, spacer=2400A
#
# [검증] nG=101, ds=2 기준 실측 28점 평균 절대오차 2.34%p (R 2.28 / G 1.51 / B 3.73)
#        Green peak 74.6 (실측 74.3). 상세: docs/현재상태_및_수정필요항목.md
product: hybrid_lens
ambient: air
grid:
  pixel_pitch_um: 0.7
  n_pixels: 4
  dxy_um: 0.01
  dz_um: 0.01
  air_margin_um: 0.2
cf_array: tetra
bayer:
- - R
  - R
  - G
  - G
- - R
  - R
  - G
  - G
- - G
  - G
  - B
  - B
- - G
  - G
  - B
  - B
materials:
  air: {}
  si: {}
  sio2: {}
  poly: {}
  al2o3: {}
  tio2: {}
  peox: {}
  hfox: {}
  tin: {}
  ti: {}
  teos: {}
  cf_red: {}
  # 소자 유효 n,k — 통과대역 소광을 실측 QE 로 역산 (적분구 측정 시 그 값으로 교체).
  # 근거/경위: docs/Green원인분석_쿠폰측정.md, 파일 헤더 참조.
  cf_green: {src: cf_green_device}
  cf_blue: {}
  ml: {}
  ml_arl: {}
  # BRL spacer 유효매질 — ILD 는 순수 SiO2 가 아니라 질화막(식각정지층) 포함.
  # n_eff 1.46/1.60/1.75/1.90 비교에서 1.75 가 R 장파장 최적 + 혼합비로 타당.
  ild_eff: {n: 1.75, k: 0.0}
stack:
  si:
    material: si
    thickness_um: 3.85
    back_reflector:
      enabled: true
      coverage: 0.25
      material: cu
      thickness_um: 0.15
      spacer_um: 0.24
      spacer_material: ild_eff
  dti:
    mode: 2x2_open
    center_open: true
    width_um: 0.09
    oxide_liner_um: 0.02
    liner: sio2
    fill: poly
    center_gap_x_um: 0.26
    center_gap_y_um: 0.26
  barl:
  - material: al2o3
    thickness_um: 0.01
  - material: tio2
    thickness_um: 0.036
  - material: peox
    thickness_um: 0.015
  - material: hfox
    thickness_um: 0.01
  - material: al2o3
    thickness_um: 0.01
  grid:
    pitch: 2
    width_um: 0.11
    top_ratio: 0.7
    coat_on: true
    coat_material: al2o3
    coat_um: 0.01
    deadzone_um: 0.1
    stack:
    - material: tin
      height_um: 0.006
    - material: ti
      height_um: 0.054
    - material: teos
      height_um: 0.33
  cf:
    R:
      material: cf_red
      thickness_um: 0.5
      curvature_um: 0
      scale_x: 0.92
      scale_y: 0.92
      chamfer_um: 0.05
      chamfer_angle: 45
    G:
      material: cf_green
      thickness_um: 0.52
      curvature_um: 0
      scale_x: 0.95
      scale_y: 0.95
      chamfer_um: 0.05
      chamfer_angle: 45
    B:
      material: cf_blue
      thickness_um: 0.475
      curvature_um: 0
      scale_x: 0.9
      scale_y: 0.9
      chamfer_um: 0.05
      chamfer_angle: 45
  ml:
    material: ml
    planar_um: 0.2
    hr: 0.55
    height_um: 0.36
    sag_height_um: 0.55
    quads:
    - - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
      - shape: 1x1
        scale: 1.14
        height_um: 0.38
    - - shape: 1x1
        scale: 1.14
        height_um: 0.38
      - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
  arl_top:
    material: ml_arl
    thickness_um: 0.09
measurement:
  bandwidth_nm: 20
  n_sub: 3
