# CIS structure · wizard v3 schema — 실측 사양 기준 demo
# ARL(top) 1200A / ML 돔 4000A / 평탄층 2000A / CF 5000A / BARL 100/100/500/500/100A
# DTI 100nm(liner 10nm, poly 채움 80nm) 클로버 / grid 100nm폭 200nm 금속 / Bayer 2x2
product: wizard_demo
grid: { pixel_pitch_um: 1.0, n_pixels: 2, dxy_um: 0.02, dz_um: 0.02, air_margin_um: 0.2 }
ambient: air
bayer:
  - [R, G]
  - [G, B]
materials:
  air:        { n: 1.00, k: 0.00 }
  si:         { n: 4.08, k: 0.028 }
  oxide:      { n: 1.46, k: 0.00 }
  arl_hi:     { n: 2.20, k: 0.00 }
  arl_lo:     { n: 1.46, k: 0.00 }
  grid_metal: { n: 0.40, k: 3.40 }
  cf_red:     { n: 1.65, k: 0.02 }
  cf_green:   { n: 1.65, k: 0.02 }
  cf_blue:    { n: 1.65, k: 0.02 }
  ml:         { n: 1.60, k: 0.00 }
  ml_arl:     { n: 1.25, k: 0.00 }
stack:
  si:  { material: si, thickness_um: 2.0 }
  dti:                       # 100nm 식각 -> 벽면 oxide 10nm -> 가운데 80nm poly(si) 채움
    { mode: 2x2_open, width_um: 0.10, oxide_liner_um: 0.01, liner: oxide, fill: si,
      center_gap_x_um: 0.20, center_gap_y_um: 0.20 }   # 클로버 center open (가로=세로)
  barl:                      # 5층 AR: 100/100/500/500/100 A
    - { material: arl_hi, thickness_um: 0.010 }
    - { material: arl_lo, thickness_um: 0.010 }
    - { material: arl_hi, thickness_um: 0.050 }
    - { material: arl_lo, thickness_um: 0.050 }
    - { material: arl_hi, thickness_um: 0.010 }
  grid:                      # CF 담는 네모 울타리: 100nm 폭 x 200nm 금속 + oxide 코팅
    { pitch: 1, width_um: 0.10, top_ratio: 0.9, coat_on: true, coat_material: oxide, coat_um: 0.02,
      stack: [ { material: grid_metal, height_um: 0.20 } ] }
  cf:                        # 5000A
    R: { material: cf_red,   thickness_um: 0.50, curvature_um: 0.0 }
    G: { material: cf_green, thickness_um: 0.50, curvature_um: 0.0 }
    B: { material: cf_blue,  thickness_um: 0.50, curvature_um: 0.0 }
  ml:                        # 평탄층 2000A + 돔 4000A (곡률 자동)
    material: ml
    planar_um: 0.20
    height_um: 0.40
    hr: 0.55
    quads:                   # 픽셀당 1x1 렌즈 (픽셀 중앙 집광)
      - - { shape: "1x1", scale: 1 }
        - { shape: "1x1", scale: 1 }
      - - { shape: "1x1", scale: 1 }
        - { shape: "1x1", scale: 1 }
    lenses: null
  arl_top: { material: ml_arl, thickness_um: 0.12 }   # ML 표면 conformal 1200A
