# hybrid lens — 운영 구성 (n,k 파일 무수정, 전체 2.28%p 역대 최저)
#
# ** BARL 은 전 층 스펙 그대로 (TiO2 360A 포함 — 사용자 확인: 스펙 고정) **
#
# 기본(hybrid_lens.yaml)에서 다른 것: coverage 0.2 -> 0.25 하나뿐
#   (M1 면적비 추정 — GDS 면적비로 교체 요망)
# cf_green 산란 바닥은 구조 설정이 아니라 물질 폴더의
# data/materials/scatter_kfloor.txt 에 있고 어느 구조든 자동 적용된다.
#
# [성적 — nG=101, 실측 28점]
#   ds=2: 전체 2.28%p (밝음 1.89 / 어둠 2.90)   G peak 76.3 (실측 74.3)
#   ds=1: 전체 2.26%p (밝음 1.93 / 어둠 2.77) — 해상도 수렴 확인
#   G@500/550/560/580 은 0.1%p 이내 일치. calibrated(역산파일 방식, 2.30)보다
#   좋아서 hybrid_lens_calibrated.yaml 은 기록용으로만 유지.
#
# [참고 — TiO2 280A 면 R 장파장이 더 좋아지나 스펙(360A) 고정 지시로 기각]
product: hybrid_lens
ambient: air
grid:
  pixel_pitch_um: 0.7
  n_pixels: 4
  dxy_um: 0.01
  dz_um: 0.01
  air_margin_um: 0.2
cf_array: tetra
bayer:
- - R
  - R
  - G
  - G
- - R
  - R
  - G
  - G
- - G
  - G
  - B
  - B
- - G
  - G
  - B
  - B
materials:
  air: {}
  si: {}
  sio2: {}
  poly: {}
  al2o3: {}
  tio2: {}
  peox: {}
  hfox: {}
  tin: {}
  ti: {}
  teos: {}
  cf_red: {}
  # 산란 바닥은 여기가 아니라 data/materials/scatter_kfloor.txt (물질의 성질,
  # 구조 아님 — 자동 적용). 이 yaml 은 구조 스펙만 담는다.
  cf_green: {}
  cf_blue: {}
  ml: {}
  ml_arl: {}
  ild_eff: {n: 1.75, k: 0.0}
stack:
  si:
    material: si
    thickness_um: 3.85
    back_reflector:
      enabled: true
      coverage: 0.25
      material: cu
      thickness_um: 0.15
      spacer_um: 0.24
      spacer_material: ild_eff
  dti:
    mode: 2x2_open
    center_open: true
    width_um: 0.09
    oxide_liner_um: 0.02
    liner: sio2
    fill: poly
    center_gap_x_um: 0.26
    center_gap_y_um: 0.26
  barl:
  - material: al2o3
    thickness_um: 0.01
  - material: tio2
    thickness_um: 0.036
  - material: peox
    thickness_um: 0.015
  - material: hfox
    thickness_um: 0.01
  - material: al2o3
    thickness_um: 0.01
  grid:
    pitch: 2
    width_um: 0.11
    top_ratio: 0.7
    coat_on: true
    coat_material: al2o3
    coat_um: 0.01
    deadzone_um: 0.1
    stack:
    - material: tin
      height_um: 0.006
    - material: ti
      height_um: 0.054
    - material: teos
      height_um: 0.33
  cf:
    R:
      material: cf_red
      thickness_um: 0.5
      curvature_um: 0
      scale_x: 0.92
      scale_y: 0.92
      chamfer_um: 0.05
      chamfer_angle: 45
    G:
      material: cf_green
      thickness_um: 0.52
      curvature_um: 0
      scale_x: 0.95
      scale_y: 0.95
      chamfer_um: 0.05
      chamfer_angle: 45
    B:
      material: cf_blue
      thickness_um: 0.475
      curvature_um: 0
      scale_x: 0.9
      scale_y: 0.9
      chamfer_um: 0.05
      chamfer_angle: 45
  ml:
    material: ml
    planar_um: 0.2
    hr: 0.55
    height_um: 0.36
    sag_height_um: 0.55
    quads:
    - - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
      - shape: 1x1
        scale: 1.14
        height_um: 0.38
    - - shape: 1x1
        scale: 1.14
        height_um: 0.38
      - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
  arl_top:
    material: ml_arl
    thickness_um: 0.09
measurement:
  bandwidth_nm: 20
  # n_sub 7: 대역 20nm 를 7점(~3.3nm 간격)으로 평균. 3점이면 Si 3.85um 캐비티
  # 간섭무늬(주기 ~10-15nm @ 620-700)가 덜 씻겨 R 640/660 이 무늬 골에 걸림.
  # 7점이면 R 장파장 침하 해소 + 밴드에지 사다리꼴 오차도 수렴(적대점검 발견①).
  # 계산시간 약 2.3배.
  n_sub: 7
