# hybrid lens — 허용노브 최적 구성 (n,k 역산 0개, 전체 2.63%p)
#
# ** BARL 은 전 층 스펙 그대로 (TiO2 360A 포함 — 사용자 확인: 스펙 고정) **
#
# 기본(hybrid_lens.yaml, 2.78%p)에서 다른 것은 단 1개:
#   coverage: 0.2 -> 0.25 (M1 면적비 추정 상향 — GDS 면적비로 교체 요망)
#   * calibrated 구성이 독립적으로 채택한 값과 동일(0.25) — 교차 부합
#
# [성적 — nG=101, ds=2, 실측 28점]
#   전체 2.63%p (R 2.29 / G 2.24 / B 3.74)   G peak 78.9 (실측 74.3)
#   coverage 곡선: 0.20→2.78 / 0.25→2.63(최소) / 0.30→2.66 / 0.50→3.08
#   ds=1 재검증: 2.58%p (밝음 2.44 / 어둠 2.79) — 해상도 수렴 확인
#
# [참고 — TiO2 를 280A 로 낮추면 2.54 까지 가능했으나 스펙(360A) 고정 지시로 기각.
#   그 이득은 BARL AR 중심 이동에 의한 R 장파장 개선분이었음]
#
# G peak +4.6 의 원인은 CF 통과대역 소광 (docs/Green원인분석_쿠폰측정.md,
# 적분구 측정 대기). B 는 단색 기준 450/500 일치 (docs/Blue_DTI_검증.md).
product: hybrid_lens
ambient: air
grid:
  pixel_pitch_um: 0.7
  n_pixels: 4
  dxy_um: 0.01
  dz_um: 0.01
  air_margin_um: 0.2
cf_array: tetra
bayer:
- - R
  - R
  - G
  - G
- - R
  - R
  - G
  - G
- - G
  - G
  - B
  - B
- - G
  - G
  - B
  - B
materials:
  air: {}
  si: {}
  sio2: {}
  poly: {}
  al2o3: {}
  tio2: {}
  peox: {}
  hfox: {}
  tin: {}
  ti: {}
  teos: {}
  cf_red: {}
  cf_green: {}
  cf_blue: {}
  ml: {}
  ml_arl: {}
  ild_eff: {n: 1.75, k: 0.0}
stack:
  si:
    material: si
    thickness_um: 3.85
    back_reflector:
      enabled: true
      coverage: 0.25
      material: cu
      thickness_um: 0.15
      spacer_um: 0.24
      spacer_material: ild_eff
  dti:
    mode: 2x2_open
    center_open: true
    width_um: 0.09
    oxide_liner_um: 0.02
    liner: sio2
    fill: poly
    center_gap_x_um: 0.26
    center_gap_y_um: 0.26
  barl:
  - material: al2o3
    thickness_um: 0.01
  - material: tio2
    thickness_um: 0.036
  - material: peox
    thickness_um: 0.015
  - material: hfox
    thickness_um: 0.01
  - material: al2o3
    thickness_um: 0.01
  grid:
    pitch: 2
    width_um: 0.11
    top_ratio: 0.7
    coat_on: true
    coat_material: al2o3
    coat_um: 0.01
    deadzone_um: 0.1
    stack:
    - material: tin
      height_um: 0.006
    - material: ti
      height_um: 0.054
    - material: teos
      height_um: 0.33
  cf:
    R:
      material: cf_red
      thickness_um: 0.5
      curvature_um: 0
      scale_x: 0.92
      scale_y: 0.92
      chamfer_um: 0.05
      chamfer_angle: 45
    G:
      material: cf_green
      thickness_um: 0.52
      curvature_um: 0
      scale_x: 0.95
      scale_y: 0.95
      chamfer_um: 0.05
      chamfer_angle: 45
    B:
      material: cf_blue
      thickness_um: 0.475
      curvature_um: 0
      scale_x: 0.9
      scale_y: 0.9
      chamfer_um: 0.05
      chamfer_angle: 45
  ml:
    material: ml
    planar_um: 0.2
    hr: 0.55
    height_um: 0.36
    sag_height_um: 0.55
    quads:
    - - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
      - shape: 1x1
        scale: 1.14
        height_um: 0.38
    - - shape: 1x1
        scale: 1.14
        height_um: 0.38
      - shape: 2x1
        orient: h
        scale: 1.11
        height_um: 0.43
  arl_top:
    material: ml_arl
    thickness_um: 0.09
measurement:
  bandwidth_nm: 20
  n_sub: 3
